<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}</style>
<title>革型 Kawagata</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/clipper-lib@6.4.2/clipper.js"></script>
<style>
/* Layout: tool rail | cutting-mat canvas | inspector. Mat green is the subject's own surface. */
:root{
  --bg:#eef0ec; --panel:#f8f9f6; --line:#d3d8cf; --fg:#1f2a24; --muted:#5f6d64;
  --accent:#b8611f; --accent-soft:#f3e1d1; --danger:#b3261e; --ok:#2f7a4b;
  --mat:#1f4a3a; --mat-minor:rgba(255,255,255,.07); --mat-major:rgba(255,255,255,.16);
  --cut:#f4efe2; --guide:#9fc3b1; --stitch:#f0a94a; --sel:#ffb36b;
  --ui:"IBM Plex Sans JP",system-ui,-apple-system,"Hiragino Sans",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141916; --panel:#1b211d; --line:#2e3832; --fg:#e4e9e3; --muted:#93a198;
  --accent:#e58a45; --accent-soft:#3a2a1d; --danger:#ef7b70; --ok:#6cc08d;
  --mat:#173a2d; --mat-minor:rgba(255,255,255,.05); --mat-major:rgba(255,255,255,.12);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141916; --panel:#1b211d; --line:#2e3832; --fg:#e4e9e3; --muted:#93a198;
  --accent:#e58a45; --accent-soft:#3a2a1d; --danger:#ef7b70; --ok:#6cc08d;
  --mat:#173a2d; --mat-minor:rgba(255,255,255,.05); --mat-major:rgba(255,255,255,.12);
  color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:13px;overflow:hidden}
.app{height:100%;display:grid;grid-template-columns:52px minmax(0,1fr) 320px;grid-template-rows:46px minmax(0,1fr) 30px;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.top{grid-column:1/4;grid-row:1;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap}
.top .brand{font-weight:700;font-size:16px;letter-spacing:.06em;color:var(--accent);margin-right:6px}
.top .grp{display:flex;align-items:center;gap:6px}
.top .lbl{font-size:11px;letter-spacing:.12em;color:var(--muted);margin-right:2px}
.top .vsep{width:1px;height:22px;background:var(--line);margin:0 6px;flex:none}
.top .spacer{flex:1}
.top .btn{padding:6px 10px}
.rail{grid-row:2/4;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:8px 6px;align-items:center}
.tool{width:40px;height:40px;border:1px solid transparent;border-radius:6px;background:none;color:var(--fg);cursor:pointer;display:grid;place-items:center;position:relative}
.tool:hover{background:var(--bg)}
.tool[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.tool kbd{position:absolute;right:2px;bottom:1px;font:9px var(--mono);color:var(--muted)}
.tool svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6}
.rail .sep{width:28px;height:1px;background:var(--line);margin:4px 0}
.stage{position:relative;background:var(--mat);overflow:hidden;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:default}
#cv.pan{cursor:grab} #cv.draw{cursor:crosshair}
.stage{grid-row:2;grid-column:2}
.status{grid-column:2/3;grid-row:3;display:flex;gap:16px;align-items:center;padding:0 12px;border-top:1px solid var(--line);background:var(--panel);font:12px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden}
.status select{font:12px var(--mono);background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:4px}
.status .hint{color:var(--fg);overflow:hidden;text-overflow:ellipsis;font-family:var(--ui)}
.side{grid-row:2/4;grid-column:3;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;display:flex;flex-direction:column}
.sec{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.sec h2{margin:0;font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.row{display:grid;grid-template-columns:64px minmax(0,1fr) 62px;gap:6px;align-items:center}
.row label{color:var(--muted);font-size:12px}
.row .val{font:12px var(--mono);text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.row .val.err{color:var(--danger)}
input[type=text],select.inp{width:100%;box-sizing:border-box;font:13px var(--mono);background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:5px 7px}
input[type=text]:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input.err{border-color:var(--danger)}
.vrow{display:grid;grid-template-columns:70px 14px minmax(0,1fr) 54px 22px;gap:4px;align-items:center}
.vrow .eq{color:var(--muted);text-align:center;font-family:var(--mono)}
.vrow .val{font:12px var(--mono);text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.ntab{display:flex;flex-direction:column;gap:3px}
.nrow{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(0,1fr) 30px 18px;gap:4px;align-items:center}
.nrow input[type=text]{font-size:12px;padding:4px 6px}
.nrow .ni{font:11px var(--mono);color:var(--muted);text-align:right}
.nrow.sub .ni{color:var(--accent)}
.nrow .nt{padding:3px 0;font-size:11px}
.x{border:none;background:none;color:var(--muted);cursor:pointer;font-size:15px;padding:0}
.x:hover{color:var(--danger)}
.btn{font:500 12px var(--ui);padding:7px 10px;border-radius:5px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.small{font-size:11px;color:var(--muted);line-height:1.5}
.check{display:flex;gap:6px;align-items:center;cursor:pointer}
.result{font:12px var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:7px 9px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-variant-numeric:tabular-nums}
.result span:nth-child(odd){color:var(--muted);font-family:var(--ui)}
table.seam{width:100%;border-collapse:collapse;font-size:12px}
table.seam td,table.seam th{padding:4px 2px;border-bottom:1px solid var(--line);text-align:left}
table.seam th{font-weight:500;color:var(--muted);font-size:11px}
table.seam td.n{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
table.seam tr{cursor:pointer} table.seam tr.on td{color:var(--accent)}
.pill{display:inline-block;font:11px var(--mono);padding:0 6px;border-radius:9px;background:var(--accent-soft);color:var(--accent)}
.empty{color:var(--muted);font-size:12px;line-height:1.6}
.toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:var(--panel);color:var(--fg);border:1px solid var(--line);padding:7px 14px;border-radius:6px;font-size:12px;box-shadow:0 4px 18px rgba(0,0,0,.25);pointer-events:none;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
[hidden]{display:none!important}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:20;padding:16px}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:8px;width:min(620px,100%);max-height:90%;display:flex;flex-direction:column;gap:10px;padding:16px;box-sizing:border-box}
.modal textarea{width:100%;box-sizing:border-box;height:300px;font:11px var(--mono);background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:4px}
@media (max-width:760px){
  body{overflow:auto}
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:46px auto 62vh 30px auto}
  .top{grid-column:1;padding-left:max(12px,env(safe-area-inset-left,0px))}
  .top .lbl,.top .spacer{display:none}
  .rail{grid-row:2;flex-direction:row;border-right:none;border-bottom:1px solid var(--line);overflow-x:auto;padding-left:max(8px,env(safe-area-inset-left,0px))}
  .rail .sep{width:1px;height:28px;margin:0 4px}
  .stage{grid-row:3;grid-column:1}.status{grid-column:1;grid-row:4}
  .side{grid-row:5;grid-column:1;border-left:none;overflow:visible}
  .status .hint{display:none}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">革型</div>
    <div class="grp" role="group" aria-label="ファイル">
      <button class="btn" id="xNew" title="空の型紙を作る（変数は残ります）">新規</button>
      <button class="btn" id="xSample" title="名刺入れのサンプルを開く">サンプル</button>
      <button class="btn" id="xLoad" title="保存した .json を開く">開く</button>
      <button class="btn" id="xJson" title="型紙を .json で保存">保存</button>
      <input type="file" id="fileIn" accept=".json,application/json" hidden>
    </div>
    <div class="spacer"></div>
    <div class="grp" role="group" aria-label="書き出し">
      <span class="lbl">書き出し</span>
      <button class="btn primary" id="xPdf" title="A4に分割した実寸PDF。各ページ下に50mmの確認目盛り。印刷は「実際のサイズ（100%）」で">実寸PDF</button>
      <button class="btn" id="xSvg" title="mm単位のSVG（裁断線・ステッチ穴・ガイドをグループ分け）">SVG</button>
      <button class="btn" id="xDxf" title="R12形式のDXF（レイヤー CUT / STITCH / GUIDE）">DXF</button>
    </div>
  </header>
  <nav class="rail" aria-label="ツール">
    <button class="tool" data-tool="select" title="選択・移動 (V)"><svg viewBox="0 0 20 20"><path d="M4 3l11 6-5 1.5L8 16z"/></svg><kbd>V</kbd></button>
    <button class="tool" data-tool="rect" title="角丸矩形 (R)"><svg viewBox="0 0 20 20"><rect x="3" y="5" width="14" height="10" rx="3"/></svg><kbd>R</kbd></button>
    <button class="tool" data-tool="circle" title="円 (C)"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="6.5"/></svg><kbd>C</kbd></button>
    <button class="tool" data-tool="line" title="直線・折れ線 (L)"><svg viewBox="0 0 20 20"><path d="M3 15l4-9 6 6 4-8"/></svg><kbd>L</kbd></button>
    <button class="tool" data-tool="poly" title="ベジェ曲線 (P)"><svg viewBox="0 0 20 20"><path d="M3 16C5 6 11 4 17 4"/><path d="M8 7.5l6-3" stroke-width="1"/><circle cx="8" cy="7.5" r="1.3"/><circle cx="14" cy="4.5" r="1.3"/></svg><kbd>P</kbd></button>
    <div class="sep"></div>
    <button class="tool" id="bUndo" title="元に戻す (⌘Z)"><svg viewBox="0 0 20 20"><path d="M7 5L3 9l4 4M3 9h9a5 5 0 010 10h-2"/></svg></button>
    <button class="tool" id="bRedo" title="やり直し (⇧⌘Z)"><svg viewBox="0 0 20 20"><path d="M13 5l4 4-4 4M17 9H8a5 5 0 000 10h2"/></svg></button>
    <button class="tool" id="bFit" title="全体表示 (F)"><svg viewBox="0 0 20 20"><path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4"/></svg></button>
  </nav>

  <main class="stage" id="stage">
    <svg id="cv" xmlns="http://www.w3.org/2000/svg">
      <g id="world"><path id="gMinor" fill="none" stroke="var(--mat-minor)" stroke-width="1" vector-effect="non-scaling-stroke"/><path id="gMajor" fill="none" stroke="var(--mat-major)" stroke-width="1" vector-effect="non-scaling-stroke"/><g id="shapes"></g><g id="overlay"></g></g>
    </svg>
    <div class="toast" id="toast" role="status"></div>
  </main>

  <div class="status">
    <span id="sPos">x 0.0 y 0.0</span>
    <span><button class="btn" id="zOut" style="padding:0 7px" aria-label="縮小">−</button> <span id="sZoom">100%</span> <button class="btn" id="zIn" style="padding:0 7px" aria-label="拡大">＋</button></span>
    <label>スナップ <select id="snap"><option value="0">なし</option><option value="0.5">0.5</option><option value="1" selected>1</option><option value="5">5</option></select> mm</label>
    <span class="hint" id="sHint"></span>
  </div>

  <aside class="side">
    <section class="sec" id="secProps"></section>
    <section class="sec">
      <h2>変数 <button class="btn" id="addVar" style="padding:3px 8px">＋ 追加</button></h2>
      <div id="vars" style="display:flex;flex-direction:column;gap:5px"></div>
      <div class="small">寸法欄には <code>W-2*R</code> のような式が書けます。変数を変えると全パーツが追従します。</div>
    </section>
    <section class="sec">
      <h2>縫い合わせチェック</h2>
      <div id="seam"></div>
    </section>
  </aside>
</div>
<div class="modal" id="modal" hidden><div class="box">
  <strong id="mTitle"></strong><div class="small" id="mNote"></div>
  <textarea id="mText" readonly></textarea>
  <div class="btns"><button class="btn primary" id="mCopy">コピー</button><button class="btn" id="mSave">テキストで保存</button><button class="btn" id="mClose">閉じる</button></div>
</div></div>

<script>
(()=>{
// ---------- expression evaluator ----------
const FN={sqrt:Math.sqrt,sin:d=>Math.sin(d*Math.PI/180),cos:d=>Math.cos(d*Math.PI/180),tan:d=>Math.tan(d*Math.PI/180),
  abs:Math.abs,min:Math.min,max:Math.max,round:Math.round,floor:Math.floor,ceil:Math.ceil,atan:x=>Math.atan(x)*180/Math.PI};
const CONST={pi:Math.PI};
function tokenize(s){
  const t=[];let i=0;const re=/[\p{L}_][\p{L}\p{N}_]*/uy;
  while(i<s.length){const c=s[i];
    if(/\s/.test(c)){i++;continue}
    if(/[0-9.]/.test(c)){let j=i;while(j<s.length&&/[0-9.]/.test(s[j]))j++;const v=parseFloat(s.slice(i,j));if(isNaN(v))throw Error('数値が不正');t.push({k:'n',v});i=j;continue}
    re.lastIndex=i;const m=re.exec(s);
    if(m){t.push({k:'id',v:m[0]});i+=m[0].length;continue}
    if('+-*/^(),'.includes(c)){t.push({k:c});i++;continue}
    if(c==='×'){t.push({k:'*'});i++;continue}
    throw Error(`「${c}」は使えません`)}
  return t}
function evalExpr(src,env){
  if(src===undefined||String(src).trim()==='')throw Error('空です');
  const t=tokenize(String(src));let p=0;
  const peek=()=>t[p],eat=k=>{if(t[p]&&t[p].k===k){p++;return true}return false};
  function expr(){let v=term();for(;;){if(eat('+'))v+=term();else if(eat('-'))v-=term();else return v}}
  function term(){let v=pow();for(;;){if(eat('*'))v*=pow();else if(eat('/'))v/=pow();else return v}}
  function pow(){const b=unary();if(eat('^'))return Math.pow(b,pow());return b}
  function unary(){if(eat('-'))return -unary();if(eat('+'))return unary();return atom()}
  function atom(){const k=peek();if(!k)throw Error('式が途中で終わっています');
    if(k.k==='n'){p++;return k.v}
    if(k.k==='('){p++;const v=expr();if(!eat(')'))throw Error('")" が足りません');return v}
    if(k.k==='id'){p++;
      if(eat('(')){const f=FN[k.v];if(!f)throw Error(`関数 ${k.v} はありません`);const a=[];if(!eat(')')){do a.push(expr());while(eat(','));if(!eat(')'))throw Error('")" が足りません')}return f(...a)}
      if(k.v in env)return env[k.v];if(k.v in CONST)return CONST[k.v];throw Error(`変数 ${k.v} が未定義`)}
    throw Error('式が不正です')}
  const v=expr();if(p<t.length)throw Error('式の後ろに余計な文字');if(!isFinite(v))throw Error('計算できません');return v}
const isNum=s=>/^\s*-?\d+(\.\d+)?\s*$/.test(String(s));
const fmt=(v,d=1)=>(Math.round(v*10**d)/10**d).toFixed(d);

// ---------- state ----------
const SAMPLE={vars:[{n:'W',e:'95'},{n:'H',e:'66'},{n:'R',e:'5'},{n:'コバ',e:'3'},{n:'ピッチ',e:'4'},{n:'穴',e:'1.2'},{n:'間',e:'15'},{n:'指',e:'24'},{n:'ベロ幅',e:'30'},{n:'ベロ長',e:'45'}],
  shapes:[
    {id:'s1',name:'外装',type:'rect',kind:'cut',p:{x:'0',y:'0',w:'W',h:'2*H',r:'R'},st:{on:true,inset:'コバ',pitch:'ピッチ',hole:'穴'}},
    {id:'s2',name:'ポケット板',type:'rect',kind:'cut',p:{x:'W+間',y:'0',w:'W',h:'H',r:'R'},st:{on:false,inset:'コバ',pitch:'ピッチ',hole:'穴'}},
    {id:'s6',name:'親指カット',type:'circle',kind:'cut',p:{cx:'W+間+W/2',cy:'0',d:'指'},st:{on:false,inset:'コバ',pitch:'ピッチ',hole:'穴'}},
    {id:'s7',name:'内ポケット',type:'bool',op:'diff',ops:['s2','s6'],kind:'cut',p:{},st:{on:true,inset:'コバ',pitch:'ピッチ',hole:'穴'}},
    {id:'s3',name:'マチ',type:'poly',kind:'cut',nodes:[{x:'110',y:'80'},{x:'150',y:'80'},{x:'140',y:'128'},{x:'120',y:'128'}],closed:true,p:{},st:{on:true,inset:'コバ',pitch:'ピッチ',hole:'穴'}},
    {id:'s8',name:'ベロ',type:'poly',kind:'cut',closed:true,p:{},st:{on:true,inset:'コバ',pitch:'ピッチ',hole:'穴'},nodes:[
      {x:'W+間+50',y:'80'},{x:'W+間+50+ベロ幅',y:'80'},
      {x:'W+間+50+ベロ幅',y:'80+ベロ長-ベロ幅/2',ho:['0','0.5523*ベロ幅/2']},
      {x:'W+間+50+ベロ幅/2',y:'80+ベロ長',t:'smooth',hi:['0.5523*ベロ幅/2','0'],ho:['-0.5523*ベロ幅/2','0']},
      {x:'W+間+50',y:'80+ベロ長-ベロ幅/2',hi:['0','0.5523*ベロ幅/2']}]},
    {id:'s4',name:'折り位置',type:'poly',kind:'guide',nodes:[{x:'0',y:'H'},{x:'W',y:'H'}],closed:false,p:{},st:{on:false,inset:'0',pitch:'ピッチ',hole:'穴'}},
    {id:'s5',name:'ホック',type:'circle',kind:'cut',p:{cx:'W/2',cy:'2*H-12',d:'8'},st:{on:false,inset:'2',pitch:'ピッチ',hole:'穴'}}
  ]};
const KEY='kawagata-v1';
let doc;try{doc=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!doc||!doc.shapes)doc=structuredClone(SAMPLE);
function migrate(d){for(const s of d.shapes||[])if(s.type==='poly'&&!s.nodes){s.nodes=(s.pts||[]).map(([x,y])=>({x:String(x),y:String(y)}));delete s.pts}return d}
migrate(doc);
const num=v=>String(+(+v).toFixed(3));
let picks=[],tool='select',snapStep=1;
let sel=null;const setSel=id=>{sel=id;picks=id?[id]:[]};
const view={tx:0,ty:0,s:3};
let undoS=[],redoS=[];
function pushUndo(){undoS.push(JSON.stringify(doc));if(undoS.length>100)undoS.shift();redoS=[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(doc))}catch(e){}}
let uid=Date.now()%1e6;const newId=()=>'s'+(uid++);
const OPS={union:'合体',diff:'差',inter:'交差',xor:'排他'};
const byId=id=>doc.shapes.find(s=>s.id===id);
const parentOf=id=>doc.shapes.find(s=>s.type==='bool'&&s.ops.includes(id));
function descendants(s,out=[]){if(s&&s.type==='bool')for(const id of s.ops){const c=byId(id);if(c){out.push(c);descendants(c,out)}}return out}
const leaves=s=>s.type==='bool'?descendants(s).filter(c=>c.type!=='bool'):[s];

// ---------- geometry ----------
function envOf(){const env={},errs={};for(const v of doc.vars){try{env[v.n]=evalExpr(v.e,env)}catch(e){errs[v.n]=e.message}}return{env,errs}}
function P(shape,key,env){return evalExpr(shape.p[key],env)}
function roundRectPts(x,y,w,h,r,seg=16){
  r=Math.max(0,Math.min(r,w/2,h/2));const pts=[];
  if(r<=0)return[[x,y],[x+w,y],[x+w,y+h],[x,y+h]];
  const cs=[[x+w-r,y+r,-90],[x+w-r,y+h-r,0],[x+r,y+h-r,90],[x+r,y+r,180]];
  pts.push([x+r,y]);

svg.addEventListener('pointermove',e=>{const m=toMM(e);$('sPos').textContent=`x ${fmt(m[0])}  y ${fmt(m[1])}`;

      const hx=Math.round((m[0]-n.x)*100)/100,hy=Math.round((m[1]-n.y)*100)/100;n.ho=[hx,hy];n.hi=[-hx,-hy];render()}return}
    let p=[snap(m[0]),snap(m[1])];const last=draft.nodes.at(-1);

  if(drag.kind==='handle'){const s=drag.s,it=C.byId[s.id];if(!it||!it.g)return;

      const warn=t=>{if(!drag.warned){toast(t);drag.warned=true}};
      if(nd){if(!isNum(sn.x)||!isNum(sn.y))return warn('この頂点は式で決まっているので、パネルで編集してください');sn.x=num(snap(m[0]));sn.y=num(snap(m[1]));render();return}

      s.p.w=String(Math.max(1,snap(m[0]-it.g.x)));s.p.h=String(Math.max(1,snap(m[1]-it.g.y)));render();return}
    if(drag.h==='rad'){if(!isNum(s.p.d)){if(!drag.warned){toast('直径が式なので、パネルで編集してください');drag.warned=true}return}
      s.p.d=String(Math.max(0.5,snap(2*Math.hypot(m[0]-it.g.cx,m[1]-it.g.cy))));render()}}});
svg.addEventListener('pointerup',e=>{svg.classList.remove('pan');
  if(draft&&draft.type==='poly'){draft.dragging=null;render()}
  if(drag&&drag.kind==='box'){const d=drag;drag=null;
    if(!d.big){if(!d.add)setSel(null);render();return}
    const x0=Math.min(d.a[0],d.b[0]),x1=Math.max(d.a[0],d.b[0]),y0=Math.min(d.a[1],d.b[1]),y1=Math.max(d.a[1],d.b[1]);

    if(d.type==='rect'){const x=Math.min(d.a[0],d.b[0]),y=Math.min(d.a[1],d.b[1]),w=Math.abs(d.b[0]-d.a[0]),h=Math.abs(d.b[1]-d.a[1]);
      if(w>=1&&h>=1){pushUndo();const s={id:newId(),name:'パーツ',type:'rect',kind:'cut',p:{x:String(x),y:String(y),w:String(w),h:String(h),r:'R' in C.env?'R':'0'},st:{on:true,inset:'コバ',pitch:'ピッチ',hole:'穴'}};fixStitchDefaults(s);doc.shapes.push(s);setSel(s.id);setTool('select');return}}
    else{const r=Math.hypot(d.b[0]-d.a[0],d.b[1]-d.a[1]);if(r>=0.5){pushUndo();const s={id:newId(),name:'穴・円',type:'circle',kind:'cut',p:{cx:String(d.a[0]),cy:String(d.a[1]),d:String(+(2*r).toFixed(2))},st:{on:false,inset:'2',pitch:'ピッチ',hole:'穴'}};fixStitchDefaults(s);doc.shapes.push(s);setSel(s.id);setTool('select');return}}
    render()}
  drag=null});
let lastDown=null;
function onDouble(e){if(draft&&draft.type==='poly'){finishPoly(false);return true}
  const s=cur();if(tool!=='select'||!s||s.type!=='poly'||picks.length>1)return false;const tg=document.elementFromPoint(e.clientX,e.clientY)||e.target;const h=tg.dataset&&tg.dataset.h;
  if(h&&/^n\d/.test(h)){pushUndo();toggleNode(s,+h.slice(1));lastPanelKey=null;render();return true}
  const g=tg.closest&&tg.closest('g[data-id]');if(g&&g.dataset.id===s.id){pushUndo();if(insertNode(s,toMM(e))){lastPanelKey=null;render();toast('頂点を追加しました');return true}undoS.pop()}
  return false}
svg.addEventListener('contextmenu',e=>e.preventDefault());
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;
  const f=Math.exp(-e.deltaY*(e.ctrlKey?0.01:0.0015)),ns=Math.min(60,Math.max(0.3,view.s*f));

function fit(){const r=svg.getBoundingClientRect();let bb=[1e9,1e9,-1e9,-1e9];
  for(const it of C.items)if(it.g){const b=bboxG(it.g);bb=[Math.min(bb[0],b[0]),Math.min(bb[1],b[1]),Math.max(bb[2],b[2]),Math.max(bb[3],b[3])]}
  if(bb[0]>bb[2])bb=[0,0,100,100];const w=bb[2]-bb[0],h=bb[3]-bb[1],pad=48;

function zoomBy(f){const r=svg.getBoundingClientRect(),px=r.width/2,py=r.height/2,ns=Math.min(60,Math.max(0.3,view.s*f));view.tx=px-(px-view.tx)*ns/view.s;view.ty=py-(py-view.ty)*ns/view.s;view.s=ns;applyView();render()}

document.addEventListener('keydown',e=>{const inField=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if(e.key===' '&&!inField){spaceDown=true;svg.classList.add('pan');e.preventDefault();return}

// ---------- export ----------
function exportItems(){C=compute();const items=[];
  for(const it of C.items){if(!it.g||it.parent)continue;items.push({s:it.s,g:it.g,st:it.st})}
  let bb=[1e9,1e9,-1e9,-1e9];for(const it of items){const b=bboxG(it.g);if(it.st)for(const[x,y]of it.st.holes){b[0]=Math.min(b[0],x);b[1]=Math.min(b[1],y)}bb=[Math.min(bb[0],b[0]),Math.min(bb[1],b[1]),Math.max(bb[2],b[2]),Math.max(bb[3],b[3])]}
  return{items,bb}}
function buildSVG(){const{items,bb}=exportItems();const m=5,x0=bb[0]-m,y0=bb[1]-m,w=bb[2]-bb[0]+2*m,h=bb[3]-bb[1]+2*m;
  let o=`<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" width="${fmt(w,3)}mm" height="${fmt(h,3)}mm" viewBox="${fmt(x0,3)} ${fmt(y0,3)} ${fmt(w,3)} ${fmt(h,3)}">\n`;
  const groups={cut:'',guide:'',stitch:''};
  for(const{s,g,st}of items){const id=esc(s.name);let e;
    if(s.type==='rect')e=`<rect x="${fmt(g.x,3)}" y="${fmt(g.y,3)}" width="${fmt(g.w,3)}" height="${fmt(g.h,3)}" rx="${fmt(g.r,3)}"><title>${id}</title></rect>\n`;
    else if(s.type==='circle')e=`<circle cx="${fmt(g.cx,3)}" cy="${fmt(g.cy,3)}" r="${fmt(g.d/2,3)}"><title>${id}</title></circle>\n`;
    else e=`<path fill-rule="evenodd" d="${s.type==='poly'?nodesD(g.nodes,g.closed):dPaths(g.paths,g.closed)}"><title>${id}</title></path>\n`;
    groups[s.kind==='guide'?'guide':'cut']+=e;
    if(st)for(const[x,y]of st.holes)groups.stitch+=`<circle cx="${fmt(x,3)}" cy="${fmt(y,3)}" r="${fmt(st.hole/2,3)}"/>\n`}
  o+=`<g id="cut" fill="none" stroke="#000" stroke-width="0.25">\n${groups.cut}</g>\n<g id="stitch" fill="none" stroke="#c0392b" stroke-width="0.15">\n${groups.stitch}</g>\n<g id="guide" fill="none" stroke="#2c6fbb" stroke-width="0.2" stroke-dasharray="2 1.5">\n${groups.guide}</g>\n</svg>\n`;return o}
function buildDXF(){const{items}=exportItems();const L=[];const add=(...a)=>L.push(...a.map(String));const n=v=>fmt(v,4);
  add(0,'SECTION',2,'HEADER',9,'$ACADVER',1,'AC1009',9,'$INSUNITS',70,4,0,'ENDSEC');
  add(0,'SECTION',2,'TABLES',0,'TABLE',2,'LAYER',70,3);
  for(const[nm,c]of[['CUT',7],['STITCH',1],['GUIDE',5]])add(0,'LAYER',2,nm,70,0,62,c,6,'CONTINUOUS');
  add(0,'ENDTAB',0,'ENDSEC',0,'SECTION',2,'ENTITIES');
  const poly=(layer,verts,closed)=>{add(0,'POLYLINE',8,layer,66,1,70,closed?1:0,10,0,20,0,30,0);for(const[x,y,b]of verts){add(0,'VERTEX',8,layer,10,n(x),20,n(-y),30,0);if(b)add(42,n(b))}add(0,'SEQEND',8,layer)};
  const circ=(layer,x,y,r)=>add(0,'CIRCLE',8,layer,10,n(x),20,n(-y),30,0,40,n(r));
  for(const{s,g,st}of items){const layer=s.kind==='guide'?'GUIDE':'CUT';
    if(s.type==='circle')circ(layer,g.cx,g.cy,g.d/2);
    else if(s.type==='rect'){const{x,y,w,h,r}=g;
      if(r<=0)poly(layer,[[x,y],[x+w,y],[x+w,y+h],[x,y+h]],true);
      else{// screen-clockwise path stays clockwise after the y flip, so arcs take a negative bulge
        const B=-Math.tan(Math.PI/8);
        poly(layer,[[x+r,y],[x+w-r,y,B],[x+w,y+r],[x+w,y+h-r,B],[x+w-r,y+h],[x+r,y+h,B],[x,y+h-r],[x,y+r,B]],true)}}
    else for(const p of g.paths)poly(layer,p,g.closed);
    if(st)for(const[hx,hy]of st.holes)circ('STITCH',hx,hy,st.hole/2)}
  add(0,'ENDSEC',0,'EOF');return L.join('\n')+'\n'}
function buildPDF(){const{items,bb}=exportItems();const K=72/25.4;
  const sizes=[[210,297],[297,210]];const M=10;let best=null;
  for(const[pw,ph]of sizes){const aw=pw-2*M,ah=ph-2*M-6,cols=Math.max(1,Math.ceil((bb[2]-bb[0]+0.01)/aw)),rows=Math.max(1,Math.ceil((bb[3]-bb[1]+0.01)/ah));
    if(!best||cols*rows<best.cols*best.rows)best={pw,ph,aw,ah,cols,rows}}
  const{pw,ph,aw,ah,cols,rows}=best;const objs=[];const pages=[];
  const F=v=>(Math.round(v*1000)/1000).toString();
  const circ=(x,y,r)=>{const c=0.5523*r;return`${F(x+r)} ${F(y)} m ${F(x+r)} ${F(y+c)} ${F(x+c)} ${F(y+r)} ${F(x)} ${F(y+r)} c ${F(x-c)} ${F(y+r)} ${F(x-r)} ${F(y+c)} ${F(x-r)} ${F(y)} c ${F(x-r)} ${F(y-c)} ${F(x-c)} ${F(y-r)} ${F(x)} ${F(y-r)} c ${F(x+c)} ${F(y-r)} ${F(x+r)} ${F(y-c)} ${F(x+r)} ${F(y)} c S\n`};
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const ox=bb[0]+c*aw,oy=bb[1]+r*ah;const T=(X,Y)=>[(M+X-ox)*K,(ph-M-(Y-oy))*K];
    let s=`q ${F(M*K)} ${F((ph-M-ah)*K)} ${F(aw*K)} ${F(ah*K)} re W n\n1 J 1 j\n`;
    for(const{s:sh,g,st}of items){
      if(sh.kind==='guide')s+='0.25 0.45 0.75 RG [4 3] 0 d 0.5 w\n';else s+='0 0 0 RG [] 0 d 0.7 w\n';
      if(sh.type==='circle'){const[x,y]=T(g.cx,g.cy);s+=circ(x,y,g.d/2*K)}
      else if(sh.type==='poly'){const N=g.nodes,P=q=>{const[x,y]=T(q[0],q[1]);return F(x)+' '+F(y)};s+=P([N[0].x,N[0].y])+' m\n';
        for(let i=0;i<(g.closed?N.length:N.length-1);i++){const c=segCtrl(N,i);s+=c.line?P(c.p3)+' l\n':`${P(c.p1)} ${P(c.p2)} ${P(c.p3)} c\n`}s+=g.closed?'h S\n':'S\n'}
      else for(const p of g.paths){s+=p.map((q,i)=>{const[x,y]=T(q[0],q[1]);return`${F(x)} ${F(y)} ${i?'l':'m'}`}).join('\n')+(g.closed?' h S\n':' S\n')}
      if(st){s+='[] 0 d 0.75 0.2 0.15 RG 0.4 w\n';for(const[hx,hy]of st.holes){const[x,y]=T(hx,hy);s+=circ(x,y,st.hole/2*K)}}}
    s+='Q\n0.5 g 0.5 G 0.3 w []0 d\n';
    for(const[cx,cy]of[[M,ph-M-ah],[M+aw,ph-M-ah],[M,ph-M],[M+aw,ph-M]]){s+=`${F((cx-3)*K)} ${F(cy*K)} m ${F((cx+3)*K)} ${F(cy*K)} l S ${F(cx*K)} ${F((cy-3)*K)} m ${F(cx*K)} ${F((cy+3)*K)} l S\n`}
    const by=(ph-M-ah-6)*K+2;s+=`0 g 0 G 0.6 w ${F(M*K)} ${F(by)} m ${F((M+50)*K)} ${F(by)} l S `;for(let i=0;i<=50;i+=10)s+=`${F((M+i)*K)} ${F(by)} m ${F((M+i)*K)} ${F(by+(i%50?2:4))} l S `;
    s+=`\nBT /F1 7 Tf ${F((M+53)*K)} ${F(by)} Td (50 mm  - print at 100% / actual size) Tj ET\n`;
    s+=`BT /F1 7 Tf ${F((pw-M-40)*K)} ${F(by)} Td (page ${c+1}-${r+1}  \\(${cols}x${rows}\\)) Tj ET\n`;
    pages.push(s)}
  const add=o=>{objs.push(o);return objs.length};
  add('<< /Type /Catalog /Pages 2 0 R >>');add('PAGES');add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>');
  const kids=[];for(const s of pages){const cid=add(`<< /Length ${s.length} >>\nstream\n${s}endstream`);kids.push(add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${F(pw*K)} ${F(ph*K)}] /Resources << /Font << /F1 3 0 R >> >> /Contents ${cid} 0 R >>`))}
  objs[1]=`<< /Type /Pages /Kids [${kids.map(k=>k+' 0 R').join(' ')}] /Count ${kids.length} >>`;
  let pdf='%PDF-1.4\n';const offs=[];objs.forEach((o,i)=>{offs.push(pdf.length);pdf+=`${i+1} 0 obj\n${o}\nendobj\n`});
  const x=pdf.length;pdf+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+offs.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('');
  pdf+=`trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${x}\n%%EOF\n`;return{pdf,n:pages.length}}
let dl=null;(async()=>{try{if(window.claude&&window.claude.use)dl=await window.claude.use('downloads')}catch(e){}})();
async function offer(filename,data){
  if(!dl){try{const url=URL.createObjectURL(new Blob([data]));const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast(filename+' を保存しました');return true}catch(e){toast('保存できませんでした');return false}}
  try{await dl.save({filename,data});toast(filename+' を保存しました');return true}
  catch(e){if(e&&e.code==='declined')return false;toast(e&&e.code==='rate_limited'?'保存の確認が開いています':'保存できませんでした');return false}}

$('xPdf').onclick=async()=>{const{pdf,n}=buildPDF();const bytes=new Uint8Array(pdf.length);for(let i=0;i<pdf.length;i++)bytes[i]=pdf.charCodeAt(i)&255;
