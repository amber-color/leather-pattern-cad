<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}</style>
<title>Parametric Pattern Plotter</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/clipper-lib@6.4.2/clipper.js"></script>
<style>
/* Layout: tool rail | cutting-mat canvas | inspector. Mat green is the subject's own surface. */
:root{
  --bg:#eef0ec; --panel:#f8f9f6; --line:#d3d8cf; --fg:#1f2a24; --muted:#5f6d64;
  --accent:#b8611f; --accent-soft:#f3e1d1; --danger:#b3261e; --ok:#2f7a4b;
  --mat:#1f4a3a; --mat-minor:rgba(255,255,255,.07); --mat-major:rgba(255,255,255,.16);
  --cut:#f4efe2; --guide:#9fc3b1; --stitch:#f0a94a; --sel:#ffb36b; --irr:#ff6f6f; --frame:#b9a7ff;
  --ui:"IBM Plex Sans JP",system-ui,-apple-system,"Hiragino Sans",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141916; --panel:#1b211d; --line:#2e3832; --fg:#e4e9e3; --muted:#93a198;
  --accent:#e58a45; --accent-soft:#3a2a1d; --danger:#ef7b70; --ok:#6cc08d;
  --mat:#173a2d; --mat-minor:rgba(255,255,255,.05); --mat-major:rgba(255,255,255,.12);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141916; --panel:#1b211d; --line:#2e3832; --fg:#e4e9e3; --muted:#93a198;
  --accent:#e58a45; --accent-soft:#3a2a1d; --danger:#ef7b70; --ok:#6cc08d;
  --mat:#173a2d; --mat-minor:rgba(255,255,255,.05); --mat-major:rgba(255,255,255,.12);
  color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:13px;overflow:hidden}
.app{height:100%;display:grid;grid-template-columns:52px minmax(0,1fr) auto auto;grid-template-rows:46px minmax(0,1fr) 30px;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.top{grid-column:1/-1;grid-row:1;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap}
.top .brand{font-weight:500;font-size:14px;letter-spacing:.01em;color:var(--accent);margin-right:10px;white-space:nowrap}
.top .brand .cap{font-weight:700;font-size:20px;color:var(--accent);line-height:1}
.opt{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;align-items:center}
.opt>label,.opt>span{font-size:12px;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg label{flex:1;text-align:center;padding:6px 0;font-size:12px;cursor:pointer;border-left:1px solid var(--line)}
.seg label:first-child{border-left:none}
/* keep the hidden radio inside its label: an input positioned elsewhere scrolls the whole page when it gets focus */
.seg label{position:relative}
.seg input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--accent-soft);color:var(--accent)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:-2px}
.seg.off{opacity:.45;pointer-events:none}
.top .grp{display:flex;align-items:center;gap:6px}
.top .lbl{font-size:11px;letter-spacing:.12em;color:var(--muted);margin-right:2px}
.top .vsep{width:1px;height:22px;background:var(--line);margin:0 6px;flex:none}
.top .spacer{flex:1}
.top .btn{padding:6px 10px}
.top .ibtn{width:34px;height:32px;padding:0;display:grid;place-items:center}
.top .ibtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.top .btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.pdfprev{display:flex;flex-wrap:wrap;gap:8px;max-height:260px;overflow:auto;padding:8px;background:var(--bg);border:1px solid var(--line);border-radius:4px}
.pdfprev figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:3px}
.pdfprev svg{width:140px;height:auto;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);display:block}
.pdfprev figcaption{font:10px var(--mono);color:var(--muted)}
.rail{grid-row:2/4;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:8px 6px;align-items:center}
.tool{width:40px;height:40px;border:1px solid transparent;border-radius:6px;background:none;color:var(--fg);cursor:pointer;display:grid;place-items:center;position:relative}
.tool:hover{background:var(--bg)}
.tool[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.tool kbd{position:absolute;right:2px;bottom:1px;font:9px var(--mono);color:var(--muted)}
.tool svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6}
.rail .sep{width:28px;height:1px;background:var(--line);margin:4px 0}
.stage{position:relative;background:var(--mat);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:default}
#cv.pan{cursor:grab} #cv.draw{cursor:crosshair}
.stage{grid-row:2;grid-column:2}
.status{grid-column:2/3;grid-row:3;display:flex;gap:16px;align-items:center;padding:0 12px;border-top:1px solid var(--line);background:var(--panel);font:12px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden}
.status select{font:12px var(--mono);background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:4px}
.status .hint{color:var(--fg);overflow:hidden;text-overflow:ellipsis;font-family:var(--ui)}
.side{grid-row:2/4;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;display:flex;flex-direction:column;box-sizing:border-box}
.side.parts{grid-column:3;width:0;border-left-width:0;overflow:hidden;visibility:hidden;transition:width .24s cubic-bezier(.2,.7,.2,1),border-left-width .24s,visibility 0s .24s}
.side.parts.open{width:300px;border-left-width:1px;visibility:visible;transition:width .24s cubic-bezier(.2,.7,.2,1),border-left-width .24s,visibility 0s}
.side.parts .sec{width:300px;flex:none;box-sizing:border-box;height:100%;overflow-y:auto;overflow-x:hidden}
.side.vars{grid-column:4;width:228px;position:relative;overflow:hidden;transition:width .24s cubic-bezier(.2,.7,.2,1)}
.side.vars.collapsed{width:38px;overflow:hidden}
/* the list scrolls inside .vfull, so a scrollbar narrows the content instead of pushing the right edge out of view */
.vfull{width:228px;flex:none;box-sizing:border-box;height:100%;overflow-y:auto;overflow-x:hidden;transition:opacity .16s}
.vmini{position:absolute;top:0;left:0;bottom:0;width:38px;display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:10px;box-sizing:border-box;opacity:0;pointer-events:none;transition:opacity .16s}
.vmini .vlabel{writing-mode:vertical-rl;letter-spacing:.3em;font-size:11px;color:var(--muted);cursor:pointer;border:none;background:none;padding:2px 0}
.side.vars.collapsed .vfull{opacity:0;pointer-events:none}
.side.vars.collapsed .vmini{opacity:1;pointer-events:auto;transition-delay:.08s}
.vhead{display:flex;align-items:center;gap:6px}
.vhead h2{flex:1}
.vbody{display:flex;flex-direction:column;gap:8px}
.vtoggle{width:26px;height:26px;padding:0;display:grid;place-items:center;flex:none;border:none;background:none;color:var(--muted);cursor:pointer;border-radius:4px}
.vtoggle:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.vtoggle:hover{color:var(--accent)}
.vtoggle svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8}
.noanim *{transition:none!important}
.sec{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.sec h2{margin:0;font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.row{display:grid;grid-template-columns:64px minmax(0,1fr) 62px;gap:6px;align-items:center}
.row label{color:var(--muted);font-size:12px}
.row .val{font:12px var(--mono);text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.row .val.err{color:var(--danger)}
input[type=text],select.inp{width:100%;box-sizing:border-box;font:13px var(--mono);background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:5px 7px}
input[type=text]:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input.err{border-color:var(--danger)}
.vrow{display:grid;grid-template-columns:minmax(0,1fr) 10px 76px 16px;grid-template-areas:"name eq expr x";gap:4px;align-items:center;border-radius:6px;transition:background-color .15s,padding .15s}
.vrow .vname{grid-area:name}.vrow .eq{grid-area:eq}.vrow textarea{grid-area:expr}.vrow .x{grid-area:x}
.vrow textarea{width:100%;box-sizing:border-box;font:13px var(--mono);background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:5px 7px;resize:none;height:29px;overflow:hidden;white-space:nowrap;line-height:1.35;display:block}
.vrow textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.vrow textarea.err{border-color:var(--danger)}
.vrow .vres,.vrow .vuse{display:none}
.vrow.open{grid-template-columns:minmax(0,1fr) 16px;grid-template-areas:"name x" "expr expr" "res res" "use use";background:var(--accent-soft);padding:8px;margin:2px -8px}
.vrow.open .eq{display:none}
.vrow.open textarea{white-space:pre-wrap;word-break:break-all;overflow:hidden}
.vrow.open .vres{display:block;grid-area:res;font:13px var(--mono);color:var(--fg);font-variant-numeric:tabular-nums;animation:vfade .18s}
.vrow.open .vres.err{color:var(--danger);font:12px var(--ui)}
.vrow.open .vuse{display:block;grid-area:use;font-size:11px;color:var(--muted);line-height:1.5;animation:vfade .18s}
@keyframes vfade{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.vrow .eq{color:var(--muted);text-align:center;font-family:var(--mono)}
.vrow .val{font:12px var(--mono);text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.edgebox{display:flex;flex-direction:column;gap:8px;border:1px solid var(--accent);border-radius:6px;padding:10px;background:var(--accent-soft)}
.edgebox h2{color:var(--accent)}
.edgebox .result{background:var(--panel)}
.ctab{display:flex;flex-direction:column;gap:4px}
.crow{display:grid;grid-template-columns:34px minmax(0,1fr) 62px 52px;gap:5px;align-items:center}
.crow .cl{font-size:12px;color:var(--muted)}
.crow .val{font:12px var(--mono);text-align:right;color:var(--muted)}.crow .val.err{color:var(--danger)}
.seg.sm label{padding:4px 0;font-size:11px}
.ntab{display:flex;flex-direction:column;gap:3px}
.nrow{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(0,1fr) 30px 18px;gap:4px;align-items:center}
.nrow input[type=text]{font-size:12px;padding:4px 6px}
.nrow .ni{font:11px var(--mono);color:var(--muted);text-align:right}
.nrow.sub .ni{color:var(--accent)}
.nrow .nt{padding:3px 0;font-size:11px}
.x{border:none;background:none;color:var(--muted);cursor:pointer;font-size:15px;padding:0}
.x:hover{color:var(--danger)}
.btn{font:500 12px var(--ui);padding:7px 10px;border-radius:5px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.small{font-size:11px;color:var(--muted);line-height:1.5}
.check{display:flex;gap:6px;align-items:center;cursor:pointer}
.result{font:12px var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:7px 9px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-variant-numeric:tabular-nums}
.result span:nth-child(odd){color:var(--muted);font-family:var(--ui)}
.pill{display:inline-block;font:11px var(--mono);padding:0 6px;border-radius:9px;background:var(--accent-soft);color:var(--accent)}
.empty{color:var(--muted);font-size:12px;line-height:1.6}
.toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);max-width:min(560px,calc(100% - 32px));white-space:normal;text-align:center;line-height:1.5;box-sizing:border-box;background:var(--panel);color:var(--fg);border:1px solid var(--line);padding:7px 14px;border-radius:6px;font-size:12px;box-shadow:0 4px 18px rgba(0,0,0,.25);pointer-events:none;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
[hidden]{display:none!important}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:20;padding:16px}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:8px;width:min(620px,100%);max-height:90%;display:flex;flex-direction:column;gap:10px;padding:16px;box-sizing:border-box}
.modal textarea{width:100%;box-sizing:border-box;height:300px;font:11px var(--mono);background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:4px}
@media (max-width:760px){
  body{overflow:auto}
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:46px auto 62vh 30px auto}
  .top{grid-column:1;padding-left:max(12px,env(safe-area-inset-left,0px))}
  .top .lbl,.top .spacer,.top .brand{display:none}
  .rail{grid-row:2;flex-direction:row;border-right:none;border-bottom:1px solid var(--line);overflow-x:auto;padding-left:max(8px,env(safe-area-inset-left,0px))}
  .rail .sep{width:1px;height:28px;margin:0 4px}
  .stage{grid-row:3;grid-column:1}.status{grid-column:1;grid-row:4}
  .side{grid-column:1;border-left:none;overflow:visible;width:auto!important;transition:none!important}
  .side.parts:not(.open){display:none}
  .side.parts .sec,.vfull{width:auto}
  .vfull,.side.parts .sec{height:auto;overflow:visible}
  .side.parts{grid-row:5}.side.vars{grid-row:6}
  .app{grid-template-rows:46px auto 62vh 30px auto auto}
  .side.vars.collapsed .vfull{display:none}
  .side.vars.collapsed .vmini{position:static;width:auto;flex-direction:row;padding:10px 16px}
  .vmini .vlabel{writing-mode:horizontal-tb}
  .status .hint{display:none}
}
@media (prefers-reduced-motion:reduce){.toast,.side,.vfull,.vmini,.vrow{transition:none!important}.vrow .vres,.vrow .vuse{animation:none!important}}
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand" title="式で描くレザークラフト型紙CAD"><span class="cap">P</span>arametric <span class="cap">P</span>attern <span class="cap">P</span>lotter</div>
    <div class="grp" role="group" aria-label="ファイル">
      <button class="btn ibtn" id="xNew" title="新規：空の型紙を作る（変数は残ります）" aria-label="新規"><svg viewBox="0 0 20 20"><path d="M5 2.5h6.5L15 6v11.5H5z"/><path d="M11.5 2.5V6H15"/><path d="M10 9v6M7 12h6"/></svg></button>
      <button class="btn ibtn" id="xSample" title="サンプル：二つ折り名刺入れの型紙を開く" aria-label="サンプル"><svg viewBox="0 0 20 20"><path d="M3 4.5h5.5a1.5 1.5 0 011.5 1.5v10a1.5 1.5 0 00-1.5-1.5H3z"/><path d="M17 4.5h-5.5A1.5 1.5 0 0010 6v10a1.5 1.5 0 011.5-1.5H17z"/></svg></button>
      <button class="btn ibtn" id="xLoad" title="開く：保存した .json を読み込む" aria-label="開く"><svg viewBox="0 0 20 20"><path d="M2.5 15.5V5a1 1 0 011-1h4l1.5 2h6.5a1 1 0 011 1v1.5"/><path d="M2.5 15.5l2.5-6.5h12.5l-2.5 6.5z"/></svg></button>
      <button class="btn ibtn" id="xJson" title="保存：型紙を .json で保存" aria-label="保存"><svg viewBox="0 0 20 20"><path d="M10 3v9.5M6 9l4 4 4-4"/><path d="M3.5 13.5v3h13v-3"/></svg></button>
      <button class="btn ibtn" id="xShare" title="共有：型紙を埋め込んだURLをクリップボードにコピー" aria-label="共有"><svg viewBox="0 0 20 20"><path d="M8.5 11.5a3 3 0 004.2 0l2.6-2.6a3 3 0 00-4.2-4.2l-1 1"/><path d="M11.5 8.5a3 3 0 00-4.2 0l-2.6 2.6a3 3 0 004.2 4.2l1-1"/></svg></button>
      <input type="file" id="fileIn" accept=".json,application/json" hidden>
    </div>
    <div class="spacer"></div>
    <div class="grp" role="group" aria-label="書き出し">
      <span class="lbl">書き出し</span>
      <button class="btn" id="xFrame" aria-pressed="false" title="PDFの用紙と向きで印刷される範囲を図面に表示">印刷枠</button>
      <button class="btn primary" id="xPdf" title="実寸のPDF。用紙と向きを選んで書き出します">PDF</button>
      <button class="btn" id="xSvg" title="mm単位のSVG（裁断線・ステッチ穴・ガイドをグループ分け）">SVG</button>
      <button class="btn" id="xDxf" title="R12形式のDXF（レイヤー CUT / STITCH / GUIDE）">DXF</button>
    </div>
  </header>
  <nav class="rail" aria-label="ツール">
    <button class="tool" data-tool="select" title="選択・移動 (V)"><svg viewBox="0 0 20 20"><path d="M4 3l11 6-5 1.5L8 16z"/></svg><kbd>V</kbd></button>
    <button class="tool" data-tool="rect" title="矩形 (R)"><svg viewBox="0 0 20 20"><rect x="3" y="5" width="14" height="10" rx="3"/></svg><kbd>R</kbd></button>
    <button class="tool" data-tool="circle" title="円 (C)"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="6.5"/></svg><kbd>C</kbd></button>
    <button class="tool" data-tool="line" title="直線・折れ線 (L)"><svg viewBox="0 0 20 20"><path d="M3 15l4-9 6 6 4-8"/></svg><kbd>L</kbd></button>
    <button class="tool" data-tool="dim" title="寸法線 (D)"><svg viewBox="0 0 20 20"><path d="M3 6v9M17 6v9M3 10.5h14"/><path d="M3 10.5l3-1.8v3.6zM17 10.5l-3-1.8v3.6z" fill="currentColor" stroke="none"/></svg><kbd>D</kbd></button>
    <button class="tool" data-tool="text" title="テキスト (T)"><svg viewBox="0 0 20 20"><path d="M4 5V3.5h12V5M10 3.5v13M7.5 16.5h5"/></svg><kbd>T</kbd></button>
    <button class="tool" data-tool="poly" title="ベジェ曲線 (P)"><svg viewBox="0 0 20 20"><path d="M3 16C5 6 11 4 17 4"/><path d="M8 7.5l6-3" stroke-width="1"/><circle cx="8" cy="7.5" r="1.3"/><circle cx="14" cy="4.5" r="1.3"/></svg><kbd>P</kbd></button>
    <div class="sep"></div>
    <button class="tool" id="bUndo" title="元に戻す (⌘Z)"><svg viewBox="0 0 20 20"><path d="M7 5L3 9l4 4M3 9h9a5 5 0 010 10h-2"/></svg></button>
    <button class="tool" id="bRedo" title="やり直し (⇧⌘Z)"><svg viewBox="0 0 20 20"><path d="M13 5l4 4-4 4M17 9H8a5 5 0 000 10h2"/></svg></button>
    <button class="tool" id="bFit" title="全体表示 (F)"><svg viewBox="0 0 20 20"><path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4"/></svg></button>
  </nav>

  <main class="stage" id="stage">
    <svg id="cv" xmlns="http://www.w3.org/2000/svg">
      <g id="world"><path id="gMinor" fill="none" stroke="var(--mat-minor)" stroke-width="1" vector-effect="non-scaling-stroke"/><path id="gMajor" fill="none" stroke="var(--mat-major)" stroke-width="1" vector-effect="non-scaling-stroke"/><g id="shapes"></g><g id="overlay"></g></g>
    </svg>
    <div class="toast" id="toast" role="status"></div>
  </main>

  <div class="status">
    <span id="sPos">x 0.0 y 0.0</span>
    <span><button class="btn" id="zOut" style="padding:0 7px" aria-label="縮小">−</button> <span id="sZoom">100%</span> <button class="btn" id="zIn" style="padding:0 7px" aria-label="拡大">＋</button></span>
    <label>スナップ <select id="snap"><option value="0">なし</option><option value="0.5">0.5</option><option value="1" selected>1</option><option value="5">5</option></select> mm</label>
    <span class="hint" id="sHint"></span>
  </div>

<script>
(()=>{
// ---------- expression evaluator ----------

const CS=1000;
const toC=paths=>paths.map(p=>p.map(([x,y])=>({X:Math.round(x*CS),Y:Math.round(y*CS)})));

// text: the box runs from the cap line (y - size) to below the baseline (y + 0.25 size), rotated clockwise around (x, y)

$('xNew').onclick=()=>{pushUndo();doc={vars:structuredClone(SAMPLE.vars),shapes:[]};setSel(null);render();toast('新規にしました（⌘Zで戻せます）')};
function setFrame(on){UI.showFrame=on;saveUI();$('xFrame').setAttribute('aria-pressed',String(on));render()}
$('xFrame').onclick=()=>{setFrame(!UI.showFrame);if(UI.showFrame){const bb=contentBB();if(bb){const L=pdfLayout(bb,{size:UI.pdfSize||'A4',orient:UI.pdfOrient||'auto'});toast(`${L.label}・${L.cols*L.rows}枚の印刷範囲を表示しています（用紙と向きはPDFボタンで変更）`,3500)}}};
// share: the whole pattern goes into the URL after "#p=" (compressed when the browser can), so nothing is uploaded anywhere
const b64u=bytes=>{let b='';for(let i=0;i<bytes.length;i+=0x8000)b+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(b).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const unb64u=str=>{const b=atob(str.replace(/-/g,'+').replace(/_/g,'/'));const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};
async function streamBytes(bytes,ctor,fmt){const st=new Blob([bytes]).stream().pipeThrough(new ctor(fmt));return new Uint8Array(await new Response(st).arrayBuffer())}
async function encodeDoc(d){const raw=new TextEncoder().encode(JSON.stringify(d));
  if(window.CompressionStream){try{return'z'+b64u(await streamBytes(raw,CompressionStream,'deflate-raw'))}catch(e){}}return'j'+b64u(raw)}
async function decodeDoc(str){const kind=str[0],bytes=unb64u(str.slice(1));const raw=kind==='z'?await streamBytes(bytes,DecompressionStream,'deflate-raw'):bytes;return JSON.parse(new TextDecoder().decode(raw))}
$('xShare').onclick=async()=>{let url;try{url=location.href.split('#')[0]+'#p='+await encodeDoc(doc)}catch(e){toast('共有用のURLを作れませんでした');return}
  const kb=(url.length/1024).toFixed(1);
  try{await navigator.clipboard.writeText(url);toast(`共有用のURLをコピーしました（${kb} KB）`)}
  catch(e){$('mTitle').textContent='共有用のURL';$('mNote').textContent='自動でコピーできなかったので、下の文字列をコピーしてください。';$('mText').value=url;$('mSave').hidden=true;$('modal').hidden=false;$('mText').focus();$('mText').select()}};
async function loadFromLink(){const h=location.hash;if(!h.startsWith('#p='))return false;
  try{const d=await decodeDoc(h.slice(3));if(!d.shapes||!d.vars)throw 0;pushUndo();doc=migrate(d);setSel(null);history.replaceState(null,'',location.pathname+location.search);fit();toast('共有された型紙を開きました（⌘Zで前の作業に戻せます）',4000);return true}
  catch(e){toast('共有リンクの型紙を読み込めませんでした');history.replaceState(null,'',location.pathname+location.search);return false}}
addEventListener('hashchange',loadFromLink);
$('xSample').onclick=()=>{pushUndo();doc=structuredClone(SAMPLE);setSel(null);fit();toast('サンプル（二つ折り名刺入れ）を開きました')};

// ---------- boot ----------
function boot(){if(!window.ClipperLib){toast('オフセット計算ライブラリを読み込めませんでした');}$('xFrame').setAttribute('aria-pressed',String(!!UI.showFrame));setTool('select');requestAnimationFrame(fit);loadFromLink()}
if(document.readyState==='complete')boot();else addEventListener('load',boot);
})();
</script>
</body>
