<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}</style>
<title>Parametric Pattern Plotter</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/clipper-lib@6.4.2/clipper.js"></script>
<style>
/* Layout: tool rail | cutting-mat canvas | inspector. Mat green is the subject's own surface. */
:root{
  --bg:#eef0ec; --panel:#f8f9f6; --line:#d3d8cf; --fg:#1f2a24; --muted:#5f6d64;
  --accent:#b8611f; --accent-soft:#f3e1d1; --danger:#b3261e; --ok:#2f7a4b;
  --mat:#1f4a3a; --mat-minor:rgba(255,255,255,.07); --mat-major:rgba(255,255,255,.16);
  --cut:#f4efe2; --guide:#9fc3b1; --stitch:#f0a94a; --sel:#ffb36b; --irr:#ff6f6f; --frame:#b9a7ff; --osnap:#7fe6ff;
  --ui:"IBM Plex Sans JP",system-ui,-apple-system,"Hiragino Sans",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141916; --panel:#1b211d; --line:#2e3832; --fg:#e4e9e3; --muted:#93a198;
  --accent:#e58a45; --accent-soft:#3a2a1d; --danger:#ef7b70; --ok:#6cc08d;
  --mat:#173a2d; --mat-minor:rgba(255,255,255,.05); --mat-major:rgba(255,255,255,.12);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141916; --panel:#1b211d; --line:#2e3832; --fg:#e4e9e3; --muted:#93a198;
  --accent:#e58a45; --accent-soft:#3a2a1d; --danger:#ef7b70; --ok:#6cc08d;
  --mat:#173a2d; --mat-minor:rgba(255,255,255,.05); --mat-major:rgba(255,255,255,.12);
  color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:13px;overflow:hidden}
.app{height:100%;display:grid;grid-template-columns:52px minmax(0,1fr) auto auto;grid-template-rows:46px minmax(0,1fr) 30px;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.top{grid-column:1/-1;grid-row:1;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap}
.top .brand{font-weight:500;font-size:14px;letter-spacing:.01em;color:var(--accent);margin-right:10px;white-space:nowrap}
.top .brand .cap{font-weight:700;font-size:20px;color:var(--accent);line-height:1}
.opt{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;align-items:center}
.opt>label,.opt>span{font-size:12px;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg label{flex:1;text-align:center;padding:6px 0;font-size:12px;cursor:pointer;border-left:1px solid var(--line)}
.seg label:first-child{border-left:none}
/* keep the hidden radio inside its label: an input positioned elsewhere scrolls the whole page when it gets focus */
.seg label{position:relative}
.seg input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--accent-soft);color:var(--accent)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:-2px}
.seg.off{opacity:.45;pointer-events:none}
.top .grp{display:flex;align-items:center;gap:6px}
.top .lbl{font-size:11px;letter-spacing:.12em;color:var(--muted);margin-right:2px}
.top .vsep{width:1px;height:22px;background:var(--line);margin:0 6px;flex:none}
.top .spacer{flex:1}
.top .btn{padding:6px 10px}
.top .ibtn{width:40px;height:40px;padding:0;display:grid;place-items:center;border:1px solid transparent;background:none;border-radius:6px;color:var(--fg)}
.top .ibtn:hover,.top .ibtn[aria-expanded="true"]{background:var(--bg);border-color:transparent}
.menuwrap{position:relative}
.menu{position:fixed;z-index:30;min-width:240px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:5px;display:flex;flex-direction:column}
.menu button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:none;background:none;color:var(--fg);padding:8px 10px;border-radius:5px;cursor:pointer;font:13px var(--ui)}
.menu button span{font-size:11px;color:var(--muted)}
.menu button:hover,.menu button:focus-visible{background:var(--accent-soft);outline:none}
.modal.help .box{width:min(760px,100%);max-height:86vh;padding:0;gap:0;overflow:hidden}
.help .hhead{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
.help .hbody{overflow:auto;padding:4px 24px 24px;line-height:1.75;font-size:14px}
.help .hbody h1{font-size:20px;margin:18px 0 6px;color:var(--accent);text-wrap:balance}
.help .hbody h2{font-size:16px;margin:24px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.help .hbody h3{font-size:14px;margin:18px 0 4px}
.help .hbody p{margin:6px 0}
.help .hbody ul{margin:4px 0;padding-left:20px}
.help .hbody li{margin:2px 0}
.help .hbody code{font:12.5px var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:0 4px}
.help .hbody table{border-collapse:collapse;font-size:13px;margin:8px 0;width:100%}
.help .hbody th,.help .hbody td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.help .hbody th{color:var(--muted);font-weight:500}
.help .hbody a{color:var(--accent)}
.help .tablewrap{overflow-x:auto}
/* same look as the tool rail: 1.6px strokes on screen (22px icon drawn on a 20-unit grid) */
.top .ibtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.45}
.top .btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.pdfprev{display:flex;flex-wrap:wrap;gap:8px;max-height:260px;overflow:auto;padding:8px;background:var(--bg);border:1px solid var(--line);border-radius:4px}
.pdfprev figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:3px}
.pdfprev svg{width:140px;height:auto;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);display:block}
.pdfprev figcaption{font:10px var(--mono);color:var(--muted)}
.rail{grid-row:2/4;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:8px 6px;align-items:center}
.tool{width:40px;height:40px;border:1px solid transparent;border-radius:6px;background:none;color:var(--fg);cursor:pointer;display:grid;place-items:center;position:relative}
.tool:hover{background:var(--bg)}
.tool[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.tool kbd{position:absolute;right:2px;bottom:1px;font:9px var(--mono);color:var(--muted)}
.tool svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6}
.rail .sep{width:28px;height:1px;background:var(--line);margin:4px 0}
.stage{position:relative;background:var(--mat);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:default}
#cv.pan{cursor:grab} #cv.draw{cursor:crosshair}
.stage{grid-row:2;grid-column:2}
.status{grid-column:2/3;grid-row:3;display:flex;gap:16px;align-items:center;padding:0 12px;border-top:1px solid var(--line);background:var(--panel);font:12px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden}
.status select{font:12px var(--mono);background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:4px}
.status .osnap{display:flex;align-items:center;gap:4px;cursor:pointer}.status .osnap input{accent-color:var(--accent);margin:0}
.status .hint{color:var(--fg);overflow:hidden;text-overflow:ellipsis;font-family:var(--ui)}
.side{grid-row:2/4;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;display:flex;flex-direction:column;box-sizing:border-box}
.side.parts{grid-column:3;width:0;border-left-width:0;overflow:hidden;visibility:hidden;transition:width .24s cubic-bezier(.2,.7,.2,1),border-left-width .24s,visibility 0s .24s}
.side.parts.open{width:300px;border-left-width:1px;visibility:visible;transition:width .24s cubic-bezier(.2,.7,.2,1),border-left-width .24s,visibility 0s}
.side.parts .sec{width:300px;flex:none;box-sizing:border-box;height:100%;overflow-y:auto;overflow-x:hidden}
.side.vars{grid-column:4;width:228px;position:relative;overflow:hidden;transition:width .24s cubic-bezier(.2,.7,.2,1)}
.side.vars.collapsed{width:38px;overflow:hidden}
/* the list scrolls inside .vfull, so a scrollbar narrows the content instead of pushing the right edge out of view */
.vfull{width:228px;flex:none;box-sizing:border-box;height:100%;overflow-y:auto;overflow-x:hidden;transition:opacity .16s}
.vmini{position:absolute;top:0;left:0;bottom:0;width:38px;display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:10px;box-sizing:border-box;opacity:0;pointer-events:none;transition:opacity .16s}
.vmini .vlabel{writing-mode:vertical-rl;letter-spacing:.3em;font-size:11px;color:var(--muted);cursor:pointer;border:none;background:none;padding:2px 0}
.side.vars.collapsed .vfull{opacity:0;pointer-events:none}
.side.vars.collapsed .vmini{opacity:1;pointer-events:auto;transition-delay:.08s}
.vhead{display:flex;align-items:center;gap:6px}
.vhead h2{flex:1}
.vbody{display:flex;flex-direction:column;gap:8px}
.vtoggle{width:26px;height:26px;padding:0;display:grid;place-items:center;flex:none;border:none;background:none;color:var(--muted);cursor:pointer;border-radius:4px}
.vtoggle:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.vtoggle:hover{color:var(--accent)}
.vtoggle svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8}
.noanim *{transition:none!important}
.sec{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.sec h2{margin:0;font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.row{display:grid;grid-template-columns:64px minmax(0,1fr) 62px;gap:6px;align-items:center}
.row label{color:var(--muted);font-size:12px}
.row .val{font:12px var(--mono);text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.row .val.err{color:var(--danger)}
input[type=text],select.inp{width:100%;box-sizing:border-box;font:13px var(--mono);background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:5px 7px}
input[type=text]:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input.err{border-color:var(--danger)}
.vrow{display:grid;grid-template-columns:minmax(0,1fr) 10px 76px 16px;grid-template-areas:"name eq expr x";gap:4px;align-items:center;border-radius:6px;transition:background-color .15s,padding .15s}
.vrow .vname{grid-area:name}.vrow .eq{grid-area:eq}.vrow textarea{grid-area:expr}.vrow .x{grid-area:x}
.vrow textarea{width:100%;box-sizing:border-box;font:13px var(--mono);background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:5px 7px;resize:none;height:29px;overflow:hidden;white-space:nowrap;line-height:1.35;display:block}
.vrow textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.vrow textarea.err{border-color:var(--danger)}
.vrow .vres,.vrow .vuse{display:none}
.vrow.open{grid-template-columns:minmax(0,1fr) 16px;grid-template-areas:"name x" "expr expr" "res res" "use use";background:var(--accent-soft);padding:8px;margin:2px -8px}
.vrow.open .eq{display:none}
.vrow.open textarea{white-space:pre-wrap;word-break:break-all;overflow:hidden}
.vrow.open .vres{display:block;grid-area:res;font:13px var(--mono);color:var(--fg);font-variant-numeric:tabular-nums;animation:vfade .18s}
.vrow.open .vres.err{color:var(--danger);font:12px var(--ui)}
.vrow.open .vuse{display:block;grid-area:use;font-size:11px;color:var(--muted);line-height:1.5;animation:vfade .18s}
@keyframes vfade{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.vrow .eq{color:var(--muted);text-align:center;font-family:var(--mono)}
.vrow .val{font:12px var(--mono);text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.edgebox{display:flex;flex-direction:column;gap:8px;border:1px solid var(--accent);border-radius:6px;padding:10px;background:var(--accent-soft)}
.edgebox h2{color:var(--accent)}
.edgebox .result{background:var(--panel)}
.ctab{display:flex;flex-direction:column;gap:4px}
.crow{display:grid;grid-template-columns:34px minmax(0,1fr) 62px 52px;gap:5px;align-items:center}
.crow .cl{font-size:12px;color:var(--muted)}
.crow .val{font:12px var(--mono);text-align:right;color:var(--muted)}.crow .val.err{color:var(--danger)}
.seg.sm label{padding:4px 0;font-size:11px}
.ntab{display:flex;flex-direction:column;gap:3px}
.nrow{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(0,1fr) 30px 18px;gap:4px;align-items:center}
.nrow input[type=text]{font-size:12px;padding:4px 6px}
.nrow .ni{font:11px var(--mono);color:var(--muted);text-align:right}
.nrow.sub .ni{color:var(--accent)}
.nrow .nt{padding:3px 0;font-size:11px}
.x{border:none;background:none;color:var(--muted);cursor:pointer;font-size:15px;padding:0}
.x:hover{color:var(--danger)}
.btn{font:500 12px var(--ui);padding:7px 10px;border-radius:5px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.small{font-size:11px;color:var(--muted);line-height:1.5}
.check{display:flex;gap:6px;align-items:center;cursor:pointer}
.result{font:12px var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:7px 9px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-variant-numeric:tabular-nums}
.result span:nth-child(odd){color:var(--muted);font-family:var(--ui)}
.pill{display:inline-block;font:11px var(--mono);padding:0 6px;border-radius:9px;background:var(--accent-soft);color:var(--accent)}
.empty{color:var(--muted);font-size:12px;line-height:1.6}
.toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);max-width:min(560px,calc(100% - 32px));white-space:normal;text-align:center;line-height:1.5;box-sizing:border-box;background:var(--panel);color:var(--fg);border:1px solid var(--line);padding:7px 14px;border-radius:6px;font-size:12px;box-shadow:0 4px 18px rgba(0,0,0,.25);pointer-events:none;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
[hidden]{display:none!important}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:20;padding:16px}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:8px;width:min(620px,100%);max-height:90%;display:flex;flex-direction:column;gap:10px;padding:16px;box-sizing:border-box}
.modal textarea{width:100%;box-sizing:border-box;height:300px;font:11px var(--mono);background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:4px}
@media (max-width:760px){
  body{overflow:auto}
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:46px auto 62vh 30px auto}
  .top{grid-column:1;padding-left:max(12px,env(safe-area-inset-left,0px))}
  .top .lbl,.top .spacer,.top .brand{display:none}
  .rail{grid-row:2;flex-direction:row;border-right:none;border-bottom:1px solid var(--line);overflow-x:auto;padding-left:max(8px,env(safe-area-inset-left,0px))}
  .rail .sep{width:1px;height:28px;margin:0 4px}
  .stage{grid-row:3;grid-column:1}.status{grid-column:1;grid-row:4}
  .side{grid-column:1;border-left:none;overflow:visible;width:auto!important;transition:none!important}
  .side.parts:not(.open){display:none}
  .side.parts .sec,.vfull{width:auto}
  .vfull,.side.parts .sec{height:auto;overflow:visible}
  /* 16px keeps phone browsers from zooming in when a field gets focus */
  input[type=text],textarea,select,.vrow textarea,.nrow input[type=text]{font-size:16px!important}
  .side.parts{grid-row:5;grid-column:1}.side.vars{grid-row:6;grid-column:1}
  .app{grid-template-rows:46px auto 62vh 30px auto auto}
  .side.vars.collapsed .vfull{display:none}
  .side.vars.collapsed .vmini{position:static;width:auto;flex-direction:row;padding:10px 16px}
  .vmini .vlabel{writing-mode:horizontal-tb}
  .status .hint,#sPos{display:none}
}
@media (prefers-reduced-motion:reduce){.toast,.side,.vfull,.vmini,.vrow{transition:none!important}.vrow .vres,.vrow .vuse{animation:none!important}}
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand" title="式で描くレザークラフト型紙CAD"><span class="cap">P</span>arametric <span class="cap">P</span>attern <span class="cap">P</span>lotter</div>
    <div class="grp" role="group" aria-label="ファイル">
      <div class="menuwrap"><button class="btn ibtn" id="xNew" title="新規" aria-label="新規" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 20 20"><path d="M5 2.5h6.5L15 6v11.5H5z"/><path d="M11.5 2.5V6H15"/></svg></button>
        <div class="menu" id="newMenu" role="menu" hidden>
          <button role="menuitem" id="mNewBlank"><b>空の型紙</b><span>変数は残して、図形をすべて消します</span></button>
          <button role="menuitem" id="mNewSample"><b>サンプル</b><span>二つ折り名刺入れ（全機能を使った例）</span></button>
        </div></div>
            <button class="btn ibtn" id="xLoad" title="開く：保存した .json を読み込む" aria-label="開く"><svg viewBox="0 0 20 20"><path d="M2.5 15.5V5a1 1 0 011-1h4l1.5 2h6.5a1 1 0 011 1v1.5"/><path d="M2.5 15.5l2.5-6.5h12.5l-2.5 6.5z"/></svg></button>
      <button class="btn ibtn" id="xJson" title="保存：型紙を .json で保存" aria-label="保存"><svg viewBox="0 0 20 20"><path d="M10 3v9.5M6 9l4 4 4-4"/><path d="M3.5 13.5v3h13v-3"/></svg></button>
      <button class="btn ibtn" id="xHelp" title="使い方" aria-label="使い方"><svg viewBox="0 0 20 20"><g fill="currentColor" stroke="none"><circle cx="10.2" cy="3.9" r="1.65"/><path d="M7.2 8L11.3 7.3V15.5Q11.3 16.1 11.9 16.1H13.2V17.3H6.9V16.1H8.2Q8.8 16.1 8.8 15.5V9.8Q8.8 9.2 8.2 9.2H7.2Z"/></g></svg></button>
      <button class="btn ibtn" id="xShare" title="共有：型紙を埋め込んだURLをクリップボードにコピー" aria-label="共有"><svg viewBox="0 0 20 20"><circle cx="14.5" cy="4.5" r="2.3"/><circle cx="5.5" cy="10" r="2.3"/><circle cx="14.5" cy="15.5" r="2.3"/><path d="M12.5 5.7L7.5 8.8M7.5 11.2l5 3.1"/></svg></button>
      <input type="file" id="fileIn" accept=".json,application/json" hidden>
    </div>
    <div class="spacer"></div>
    <div class="grp" role="group" aria-label="書き出し">
      <span class="lbl">書き出し</span>
      <button class="btn" id="xFrame" aria-pressed="false" title="PDFの用紙と向きで印刷される範囲を図面に表示">印刷枠</button>
      <button class="btn primary" id="xPdf" title="実寸のPDF。用紙と向きを選んで書き出します">PDF</button>
      <button class="btn" id="xSvg" title="mm単位のSVG（裁断線・ステッチ穴・ガイドをグループ分け）">SVG</button>
      <button class="btn" id="xDxf" title="R12形式のDXF（レイヤー CUT / STITCH / GUIDE）">DXF</button>
    </div>
  </header>
  <nav class="rail" aria-label="ツール">
    <button class="tool" data-tool="select" title="選択・移動 (V)"><svg viewBox="0 0 20 20"><path d="M4 3l11 6-5 1.5L8 16z"/></svg><kbd>V</kbd></button>
    <button class="tool" data-tool="rect" title="矩形 (R)"><svg viewBox="0 0 20 20"><rect x="3" y="5" width="14" height="10" rx="3"/></svg><kbd>R</kbd></button>

<script>
(()=>{
// ---------- expression evaluator ----------
const FN={sqrt:Math.sqrt,sin:d=>Math.sin(d*Math.PI/180),cos:d=>Math.cos(d*Math.PI/180),tan:d=>Math.tan(d*Math.PI/180),
  abs:Math.abs,min:Math.min,max:Math.max,round:Math.round,floor:Math.floor,ceil:Math.ceil,atan:x=>Math.atan(x)*180/Math.PI};
const CONST={pi:Math.PI};
// shape references: 外装.右 or [内装ポケット（左）].上 — a shape's name, a dot and one of its properties
const IDRE=/^[\p{L}_][\p{L}\p{N}_]*$/u;
function tokenize(s){
  const t=[];let i=0;const re=/[\p{L}_][\p{L}\p{N}_]*/uy;
  const prop=()=>{if(s[i]!=='.')return null;re.lastIndex=i+1;const m=re.exec(s);if(!m)throw Error('「.」の後ろに図形の値の名前（右・上・幅など）を書いてください');i+=1+m[0].length;return m[0]};
  while(i<s.length){const c=s[i],at=i;
    if(/\s/.test(c)){i++;continue}
    if(/[0-9.]/.test(c)){let j=i;while(j<s.length&&/[0-9.]/.test(s[j]))j++;const v=parseFloat(s.slice(i,j));if(isNaN(v))throw Error('数値が不正');t.push({k:'n',v,at,end:j});i=j;continue}
    if(c==='['){const j=s.indexOf(']',i);if(j<0)throw Error('「]」が足りません');const name=s.slice(i+1,j).trim();i=j+1;
      const pr=prop();if(!pr)throw Error(`[${name}] の後ろに「.右」のような値の名前が要ります`);t.push({k:'ref',name,prop:pr,at,end:i});continue}
    re.lastIndex=i;const m=re.exec(s);
    if(m){i+=m[0].length;if(s[i]==='.'&&/[\p{L}_]/u.test(s[i+1]||'')){const pr=prop();t.push({k:'ref',name:m[0],prop:pr,at,end:i});continue}
      t.push({k:'id',v:m[0],at,end:i});continue}
    if('+-*/^(),'.includes(c)){t.push({k:c,at,end:i+1});i++;continue}
    if(c==='×'){t.push({k:'*',at,end:i+1});i++;continue}
    throw Error(`「${c}」は使えません`)}
  return t}
function evalExpr(src,env){
  if(src===undefined||String(src).trim()==='')throw Error('空です');
  const t=tokenize(String(src));let p=0;
  const peek=()=>t[p],eat=k=>{if(t[p]&&t[p].k===k){p++;return true}return false};
  function expr(){let v=term();for(;;){if(eat('+'))v+=term();else if(eat('-'))v-=term();else return v}}
  function term(){let v=pow();for(;;){if(eat('*'))v*=pow();else if(eat('/'))v/=pow();else return v}}
  function pow(){const b=unary();if(eat('^'))return Math.pow(b,pow());return b}
  function unary(){if(eat('-'))return -unary();if(eat('+'))return unary();return atom()}
  function atom(){const k=peek();if(!k)throw Error('式が途中で終わっています');
    if(k.k==='n'){p++;return k.v}
    if(k.k==='ref'){p++;if(!env.$ref)throw Error('変数の式では図形を参照できません');return env.$ref(k.name,k.prop)}
    if(k.k==='('){p++;const v=expr();if(!eat(')'))throw Error('")" が足りません');return v}
    if(k.k==='id'){p++;
      if(eat('(')){const f=FN[k.v];if(!f)throw Error(`関数 ${k.v} はありません`);const a=[];if(!eat(')')){do a.push(expr());while(eat(','));if(!eat(')'))throw Error('")" が足りません')}return f(...a)}
      if(k.v in env)return env[k.v];if(k.v in CONST)return CONST[k.v];throw Error(`変数 ${k.v} が未定義`)}
    throw Error('式が不正です')}

// ---------- state ----------

const SAMPLE={vars:[{n:'名刺W',e:'91'},{n:'名刺H',e:'55'},{n:'ゆとり',e:'3'},{n:'縫い代',e:'3'},{n:'ピッチ',e:'4'},{n:'穴',e:'1.2'},{n:'R',e:'4'},{n:'背幅',e:'8'},{n:'指',e:'22'},{n:'間',e:'12'},

    {n:'ベロ幅',e:'26'},{n:'重ね',e:'20'},{n:'ベロ長',e:'重ね+背幅+30'},{n:'ホック穴',e:'3'},{n:'右列',e:'外装幅+間'},{n:'タグ上',e:'ベロ幅+間+9'}],
  shapes:[
    {id:'s1',name:'外装',type:'rect',kind:'cut',p:{x:'0',y:'0',w:'外装幅',h:'高さ',r:'R'},st:ST(true,{'0:0':{pos:'center'},'0:2':{pos:'center'}})},
    {id:'g1',name:'背',type:'rect',kind:'guide',p:{x:'ポケット幅',y:'0',w:'背幅',h:'高さ',r:'0'},st:ST(false)},
    {id:'g2',name:'ベロ付け位置',type:'rect',kind:'guide',p:{x:'外装幅-重ね',y:'(高さ-ベロ幅)/2',w:'重ね',h:'ベロ幅',r:'0'},st:ST(false)},
    {id:'h1',name:'ホック（外装）',type:'circle',kind:'cut',p:{cx:'ベロ長-重ね-背幅-ベロ幅/2',cy:'高さ/2',d:'ホック穴'},st:ST(false)},
    {id:'p1',name:'ポケット板（左）',type:'rect',kind:'cut',p:{x:'0',y:'高さ+間',w:'ポケット幅',h:'高さ',r:'R'},st:ST(false)},
    {id:'c1',name:'指かけ（左）',type:'circle',kind:'cut',p:{cx:'ポケット幅',cy:'高さ+間+高さ/2',d:'指'},st:ST(false)},
    {id:'b1',name:'内装ポケット（左）',type:'bool',op:'diff',ops:['p1','c1'],kind:'cut',p:{},st:ST(true,{'0:0':{pos:'end'},'0:1':{off:true},'0:2':{off:true},'0:3':{off:true},'0:4':{pos:'start'}})},
    {id:'p2',name:'ポケット板（右）',type:'rect',kind:'cut',p:{x:'ポケット幅+背幅',y:'高さ+間',w:'ポケット幅',h:'高さ',r:'R'},st:ST(false)},
    {id:'c2',name:'指かけ（右）',type:'circle',kind:'cut',p:{cx:'ポケット幅+背幅',cy:'高さ+間+高さ/2',d:'指'},st:ST(false)},
    {id:'b2',name:'内装ポケット（右）',type:'bool',op:'diff',ops:['p2','c2'],kind:'cut',p:{},st:ST(true,{'0:0':{pos:'start'},'0:2':{pos:'end'},'0:3':{off:true},'0:4':{off:true},'0:5':{off:true}})},
    {id:'f1',name:'ベロ',type:'poly',kind:'cut',closed:true,p:{},st:ST(true),nodes:[
      {x:'右列',y:'0'},
      {x:'右列+ベロ長-ベロ幅/2',y:'0',ho:[K_('ベロ幅/2'),'0']},
      {x:'右列+ベロ長',y:'ベロ幅/2',t:'smooth',hi:['0',`-${K_('ベロ幅/2')}`],ho:['0',K_('ベロ幅/2')]},

    {id:'h2',name:'ホック（ベロ）',type:'circle',kind:'cut',p:{cx:'右列+ベロ長-ベロ幅/2',cy:'ベロ幅/2',d:'ホック穴'},st:ST(false)},
    {id:'t1',name:'ロゴタグ',type:'poly',kind:'cut',closed:true,p:{},st:{...ST(true),inset:'2.5'},nodes:[

    TX('x0','タイトル','二つ折り名刺入れ（名刺 91 × 55 mm）','0','-17','5','cut'),
    TX('x1','注記：外装','外装 ×1（銀面）','8','高さ-8','3.5'),
    TX('x2','注記：内装','内装ポケット ×2（左右）','8','2*高さ+間-8','3.5'),
    TX('x3','注記：ベロ','ベロ ×1','右列+5','ベロ幅/2+1.3','3.5'),

let uid=Date.now()%1e6;const newId=()=>'s'+(uid++);

const byId=id=>doc.shapes.find(s=>s.id===id);

// ---------- geometry ----------
function envOf(){const env={},errs={};for(const v of doc.vars){try{env[v.n]=evalExpr(v.e,env)}catch(e){errs[v.n]=e.message}}return{env,errs}}

// rectangle corners in drawing order (top-right, bottom-right, bottom-left, top-left); each is round (角丸), chamfer (面取り) or none

function rectCorners(x,y,w,h,cr){const D=[
    {C:[x,y],pin:r=>[x,y+r],pout:r=>[x+r,y],c:r=>[x+r,y+r],a0:180},
    {C:[x+w,y],pin:r=>[x+w-r,y],pout:r=>[x+w,y+r],c:r=>[x+w-r,y+r],a0:-90},
    {C:[x+w,y+h],pin:r=>[x+w,y+h-r],pout:r=>[x+w-r,y+h],c:r=>[x+w-r,y+h-r],a0:0},
    {C:[x,y+h],pin:r=>[x+r,y+h],pout:r=>[x,y+h-r],c:r=>[x+r,y+h-r],a0:90}];
  return[1,2,3,0].map(i=>{const{t,r}=cr[i],d=D[i];return t==='none'||r<=0?{i,t:'none',r:0,C:d.C,pin:d.C,pout:d.C}:{i,t,r,C:d.C,pin:d.pin(r),pout:d.pout(r),c:d.c(r),a0:d.a0}})}
function cornerRectPts(x,y,w,h,cr,seg=16){const pts=[];
  for(const k of rectCorners(x,y,w,h,cr)){if(k.t==='none')pts.push(k.C);else if(k.t==='chamfer')pts.push(k.pin,k.pout);
    else for(let j=0;j<=seg;j++){const a=(k.a0+90*j/seg)*Math.PI/180;pts.push([k.c[0]+k.r*Math.cos(a),k.c[1]+k.r*Math.sin(a)])}}

function rectPathD(g){const P=q=>fmt(q[0],3)+' '+fmt(q[1],3),ks=rectCorners(g.x,g.y,g.w,g.h,g.corners);let d='M'+P(ks[3].pout);
  for(const k of ks){d+='L'+P(k.pin);if(k.t==='round')d+=`A${fmt(k.r,3)} ${fmt(k.r,3)} 0 0 1 ${P(k.pout)}`;else if(k.t==='chamfer')d+='L'+P(k.pout)}return d+'Z'}
function roundRectPts(x,y,w,h,r,seg=16){
  r=Math.max(0,Math.min(r,w/2,h/2));const pts=[];
  if(r<=0)return[[x,y],[x+w,y],[x+w,y+h],[x,y+h]];
  const cs=[[x+w-r,y+r,-90],[x+w-r,y+h-r,0],[x+r,y+h-r,90],[x+r,y+r,180]];
  pts.push([x+r,y]);
  for(const[cx,cy,a0]of cs)for(let i=0;i<=seg;i++){const a=(a0+90*i/seg)*Math.PI/180;pts.push([cx+r*Math.cos(a),cy+r*Math.sin(a)])}
  return pts}
const CS=1000;

function buildPDF(o){const{items,bb}=exportItems();const K=72/25.4;

  const masks=new Map();let mi=0;for(const{s:sh,g}of items)if(g.isText&&g.str)masks.set(sh.id,{name:'Im'+(++mi),m:textMask(g.str,g.size)});const objs=[];const pages=[];
  const F=v=>(Math.round(v*1000)/1000).toString();
  const circ=(x,y,r)=>{const c=0.5523*r;return`${F(x+r)} ${F(y)} m ${F(x+r)} ${F(y+c)} ${F(x+c)} ${F(y+r)} ${F(x)} ${F(y+r)} c ${F(x-c)} ${F(y+r)} ${F(x-r)} ${F(y+c)} ${F(x-r)} ${F(y)} c ${F(x-r)} ${F(y-c)} ${F(x-c)} ${F(y-r)} ${F(x)} ${F(y-r)} c ${F(x+c)} ${F(y-r)} ${F(x+r)} ${F(y-c)} ${F(x+r)} ${F(y)} c S\n`};
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const ox=bb[0]+c*aw,oy=bb[1]+r*ah;const T=(X,Y)=>[(M+X-ox)*K,(ph-M-(Y-oy))*K];
    let s=`q ${F(M*K)} ${F((ph-M-ah)*K)} ${F(aw*K)} ${F(ah*K)} re W n\n1 J 1 j\n`;
    for(const{s:sh,g,st}of items){
      if(g.isDim){const D=g.dim,P=q=>{const[x,y]=T(q[0],q[1]);return F(x)+' '+F(y)};
        s+='0.27 0.27 0.27 RG 0.27 0.27 0.27 rg [] 0 d 0.4 w\n'+D.lines.map(([a,b])=>`${P(a)} m ${P(b)} l S`).join('\n')+'\n'+D.arrows.map(t=>`${P(t[0])} m ${P(t[1])} l ${P(t[2])} l h f`).join('\n')+'\n';
        // Helvetica widths: digits 0.556 em, point 0.278 em
        const fs=D.text.size*K,tw=[...D.text.str].reduce((w,ch)=>w+(ch==='.'?0.278:0.556),0)*D.text.size,st=[D.text.x-D.text.dir[0]*tw/2,D.text.y-D.text.dir[1]*tw/2],[sx,sy]=T(st[0],st[1]),a=-D.text.rot*Math.PI/180;
        s+=`BT /F1 ${F(fs)} Tf ${F(Math.cos(a))} ${F(Math.sin(a))} ${F(-Math.sin(a))} ${F(Math.cos(a))} ${F(sx)} ${F(sy)} Tm (${D.text.str}) Tj ET\n`;continue}
      if(g.isText){const m=masks.get(sh.id);if(!m)continue;const a=g.rot*Math.PI/180,cs=Math.cos(a),sn=Math.sin(a),Rt=(px,py)=>{const dx=px-g.x,dy=py-g.y;return T(g.x+dx*cs-dy*sn,g.y+dx*sn+dy*cs)};
        const top=g.y-g.size,BL=Rt(g.x,top+m.m.hmm),BR=Rt(g.x+m.m.wmm,top+m.m.hmm),TL=Rt(g.x,top);
        s+=`q ${sh.kind==='guide'?'0.25 0.45 0.75':'0 0 0'} rg ${F(BR[0]-BL[0])} ${F(BR[1]-BL[1])} ${F(TL[0]-BL[0])} ${F(TL[1]-BL[1])} ${F(BL[0])} ${F(BL[1])} cm /${m.name} Do Q\n`;continue}
      if(sh.kind==='guide')s+='0.25 0.45 0.75 RG [4 3] 0 d 0.5 w\n';else s+='0 0 0 RG [] 0 d 0.7 w\n';
      if(sh.type==='circle'){const[x,y]=T(g.cx,g.cy);s+=circ(x,y,g.d/2*K)}
      else if(sh.type==='poly'){const N=g.nodes,P=q=>{const[x,y]=T(q[0],q[1]);return F(x)+' '+F(y)};s+=P([N[0].x,N[0].y])+' m\n';
        for(let i=0;i<(g.closed?N.length:N.length-1);i++){const c=segCtrl(N,i);s+=c.line?P(c.p3)+' l\n':`${P(c.p1)} ${P(c.p2)} ${P(c.p3)} c\n`}s+=g.closed?'h S\n':'S\n'}
      else for(const p of g.paths){s+=p.map((q,i)=>{const[x,y]=T(q[0],q[1]);return`${F(x)} ${F(y)} ${i?'l':'m'}`}).join('\n')+(g.closed?' h S\n':' S\n')}
      if(st){s+='[] 0 d 0.75 0.2 0.15 RG 0.4 w\n';for(const[hx,hy]of st.holes){const[x,y]=T(hx,hy);s+=circ(x,y,st.hole/2*K)}}}
    s+='Q\n0.5 g 0.5 G 0.3 w []0 d\n';
    for(const[cx,cy]of[[M,ph-M-ah],[M+aw,ph-M-ah],[M,ph-M],[M+aw,ph-M]]){s+=`${F((cx-3)*K)} ${F(cy*K)} m ${F((cx+3)*K)} ${F(cy*K)} l S ${F(cx*K)} ${F((cy-3)*K)} m ${F(cx*K)} ${F((cy+3)*K)} l S\n`}
    const by=(ph-M-ah-6)*K+2;s+=`0 g 0 G 0.6 w ${F(M*K)} ${F(by)} m ${F((M+50)*K)} ${F(by)} l S `;for(let i=0;i<=50;i+=10)s+=`${F((M+i)*K)} ${F(by)} m ${F((M+i)*K)} ${F(by+(i%50?2:4))} l S `;
    s+=`\nBT /F1 7 Tf ${F((M+53)*K)} ${F(by)} Td (50 mm  - print at 100% / actual size) Tj ET\n`;
    s+=`BT /F1 7 Tf ${F((pw-M-40)*K)} ${F(by)} Td (page ${c+1}-${r+1}  \\(${cols}x${rows}\\)) Tj ET\n`;
    pages.push(s)}
  const add=o=>{objs.push(o);return objs.length};
  add('<< /Type /Catalog /Pages 2 0 R >>');add('PAGES');add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>');
  let xo='';for(const v of masks.values()){const id=add(`<< /Type /XObject /Subtype /Image /Width ${v.m.w} /Height ${v.m.h} /ImageMask true /BitsPerComponent 1 /Decode [1 0] /Length ${v.m.bin.length} >>\nstream\n${v.m.bin}\nendstream`);xo+=`/${v.name} ${id} 0 R `}
  const kids=[];for(const s of pages){const cid=add(`<< /Length ${s.length} >>\nstream\n${s}endstream`);kids.push(add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${F(pw*K)} ${F(ph*K)}] /Resources << /Font << /F1 3 0 R >>${xo?` /XObject << ${xo}>>`:''} >> /Contents ${cid} 0 R >>`))}
  objs[1]=`<< /Type /Pages /Kids [${kids.map(k=>k+' 0 R').join(' ')}] /Count ${kids.length} >>`;
  let pdf='%PDF-1.4\n';const offs=[];objs.forEach((o,i)=>{offs.push(pdf.length);pdf+=`${i+1} 0 obj\n${o}\nendobj\n`});
  const x=pdf.length;pdf+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+offs.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('');
  pdf+=`trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${x}\n%%EOF\n`;return{pdf,n:pages.length,label:L.label}}
let dl=null;(async()=>{try{if(window.claude&&window.claude.use)dl=await window.claude.use('downloads')}catch(e){}})();
async function offer(filename,data){
  if(!dl){try{const url=URL.createObjectURL(new Blob([data]));const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast(filename+' を保存しました');return true}catch(e){toast('保存できませんでした');return false}}
  try{await dl.save({filename,data});toast(filename+' を保存しました');return true}
  catch(e){if(e&&e.code==='declined')return false;toast(e&&e.code==='rate_limited'?'保存の確認が開いています':'保存できませんでした');return false}}
$('mClose').onclick=()=>$('modal').hidden=true;
$('modal').onclick=e=>{if(e.target.id==='modal')$('modal').hidden=true};
$('mCopy').onclick=()=>{const t=$('mText');navigator.clipboard.writeText(t.value).then(()=>toast('コピーしました'),()=>{t.focus();t.select();toast('選択しました。⌘Cでコピーしてください')})};
function pdfOpts(){return{size:$('pdfSize').value,orient:(document.querySelector('input[name=pdfo]:checked')||{}).value||'auto'}}
function updatePdfInfo(){const o=pdfOpts(),{bb,items}=exportItems();$('pdfOrient').classList.toggle('off',o.size==='fit');
  if(!items.length){$('pdfInfo').innerHTML='<span>書き出す図形がありません</span><span></span>';$('pdfGo').disabled=true;return}$('pdfGo').disabled=false;
  const L=pdfLayout(bb,o);renderPdfPreview(L,items,bb);$('pdfInfo').innerHTML=`<span>用紙</span><span>${L.label}</span><span>枚数</span><span>${L.cols*L.rows}枚${L.cols*L.rows>1?`（横${L.cols} × 縦${L.rows}）`:''}</span><span>型紙</span><span>${fmt(bb[2]-bb[0])} × ${fmt(bb[3]-bb[1])} mm</span>`}
$('xPdf').onclick=()=>{$('pdfSize').value=UI.pdfSize||'A4';(document.getElementById({auto:'pdfoA',portrait:'pdfoP',landscape:'pdfoL'}[UI.pdfOrient||'auto'])).checked=true;
  updatePdfInfo();$('pdfModal').hidden=false;$('pdfGo').focus()};
// the print frame follows whatever is chosen in the dialog
const pdfChanged=()=>{const o=pdfOpts();UI.pdfSize=o.size;UI.pdfOrient=o.orient;saveUI();updatePdfInfo();render()};
$('pdfSize').onchange=pdfChanged;$('pdfOrient').addEventListener('change',pdfChanged);
function renderPdfPreview(L,items,bb){const{pw,ph,aw,ah,cols,rows,M}=L,max=12,shown=Math.min(cols*rows,max);let h='',n=0;
  const art=items.map(({s,g,st})=>{if(g.isText)return`<text x="${g.x}" y="${g.y}" font-size="${g.size}" fill="${s.kind==='guide'?'#2c6fbb':'#000'}"${g.rot?` transform="rotate(${g.rot} ${g.x} ${g.y})"`:''}>${esc(g.str)}</text>`;
    if(g.isDim){const D=g.dim;return`<path d="${D.lines.map(([a,b])=>`M${a[0]} ${a[1]}L${b[0]} ${b[1]}`).join('')}" stroke="#444" stroke-width="0.25" fill="none"/><text x="${D.text.x}" y="${D.text.y}" font-size="${D.text.size}" text-anchor="middle" fill="#444" transform="rotate(${D.text.rot} ${D.text.x} ${D.text.y})">${D.text.str}</text>`}
    let o=`<path d="${dPaths(g.paths,g.closed)}" fill="none" stroke="${s.kind==='guide'?'#2c6fbb':'#000'}" stroke-width="0.5"${s.kind==='guide'?' stroke-dasharray="3 2"':''}/>`;
    if(st)o+=`<path d="${st.holes.map(([x,y])=>`M${x-0.6} ${y}a0.6 0.6 0 1 0 1.2 0a0.6 0.6 0 1 0 -1.2 0`).join('')}" fill="#c0392b"/>`;return o}).join('');
  for(let r=0;r<rows&&n<shown;r++)for(let c=0;c<cols&&n<shown;c++,n++){const ox=bb[0]+c*aw,oy=bb[1]+r*ah,id='pv'+n;
    h+=`<figure><svg viewBox="0 0 ${pw} ${ph}" role="img" aria-label="${c+1}-${r+1} ページ"><defs><clipPath id="${id}"><rect x="${M}" y="${M}" width="${aw}" height="${ah}"/></clipPath></defs>
      <rect x="${M}" y="${M}" width="${aw}" height="${ah}" fill="none" stroke="#bbb" stroke-width="0.6" stroke-dasharray="4 3"/>
      <g clip-path="url(#${id})"><g transform="translate(${M-ox} ${M-oy})" font-family="sans-serif">${art}</g></g>
      <path d="M${M} ${ph-M+2}h50" stroke="#000" stroke-width="0.6"/></svg><figcaption>${c+1}-${r+1}</figcaption></figure>`}
  if(cols*rows>max)h+=`<figure><figcaption>ほか ${cols*rows-max} 枚</figcaption></figure>`;$('pdfPrev').innerHTML=h}

$('pdfGo').onclick=async()=>{const o=pdfOpts();UI.pdfSize=o.size;UI.pdfOrient=o.orient;saveUI();$('pdfModal').hidden=true;
  const{pdf,n,label}=buildPDF(o);const bytes=new Uint8Array(pdf.length);for(let i=0;i<pdf.length;i++)bytes[i]=pdf.charCodeAt(i)&255;
  if(await offer('pattern.pdf',bytes))toast(`${label}・${n}枚のPDFを保存しました`)};

function closeNewMenu(){$('newMenu').hidden=true;$('xNew').setAttribute('aria-expanded','false')}
$('xNew').onclick=e=>{e.stopPropagation();const m=$('newMenu');if(!m.hidden){closeNewMenu();return}const r=$('xNew').getBoundingClientRect();
  m.style.left=Math.max(8,Math.min(r.left,innerWidth-260))+'px';m.style.top=(r.bottom+6)+'px';m.hidden=false;$('xNew').setAttribute('aria-expanded','true');$('mNewBlank').focus()};

  if(e.key==='Escape'){e.stopPropagation();closeNewMenu();$('xNew').focus()}else if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();it[(i+(e.key==='ArrowDown'?1:it.length-1))%it.length].focus()}});

// usage guide: the repository README, rendered by a small Markdown subset (headings, lists, tables, code, bold, links)
function mdInline(t){return esc(t).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
  .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>').replace(/(^|[\s：>])(https?:\/\/[^\s<*]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>')}
function mdToHtml(md){const L=md.replace(/\r/g,'').split('\n'),out=[];let i=0,para=[];const flush=()=>{if(para.length){out.push('<p>'+para.map(mdInline).join('<br>')+'</p>');para=[]}};
  while(i<L.length){const l=L[i];
    if(!l.trim()){flush();i++;continue}
    let m=l.match(/^(#{1,3})\s+(.*)$/);if(m){flush();out.push(`<h${m[1].length}>${mdInline(m[2])}</h${m[1].length}>`);i++;continue}
    if(/^\s*\|/.test(l)){flush();const rows=[];while(i<L.length&&/^\s*\|/.test(L[i]))rows.push(L[i++]);const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      const head=cells(rows[0]),body=rows.slice(2).map(cells);out.push('<div class="tablewrap"><table><thead><tr>'+head.map(c=>`<th>${mdInline(c)}</th>`).join('')+'</tr></thead><tbody>'+body.map(r=>'<tr>'+r.map(c=>`<td>${mdInline(c)}</td>`).join('')+'</tr>').join('')+'</tbody></table></div>');continue}
    if(/^\s*- /.test(l)){flush();let html='',depth=-1;while(i<L.length&&/^\s*- /.test(L[i])){const d=Math.floor(L[i].match(/^\s*/)[0].length/2),txt=L[i].replace(/^\s*- /,'');
        if(d>depth){html+='<ul>'.repeat(d-depth);depth=d}else{html+='</li>';while(depth>d){html+='</ul></li>';depth--}}html+='<li>'+mdInline(txt);i++}
      html+='</li>';while(depth>0){html+='</ul></li>';depth--}html+='</ul>';out.push(html);continue}
    para.push(l);i++}
  flush();return out.join('')}
let helpLoaded=false;
async function openHelp(){$('helpModal').hidden=false;$('helpClose').focus();if(helpLoaded)return;
  try{const r=await fetch('README.md',{cache:'no-cache'});if(!r.ok)throw 0;$('helpBody').innerHTML=mdToHtml(await r.text());helpLoaded=true}
  catch(e){$('helpBody').innerHTML='<p>使い方を読み込めませんでした。<a href="https://github.com/amber-color/leather-pattern-cad#readme" target="_blank" rel="noopener">GitHub の README</a> を開いてください。</p>'}}
$('xHelp').onclick=openHelp;$('helpClose').onclick=()=>$('helpModal').hidden=true;

$('mNewBlank').onclick=()=>{closeNewMenu();pushUndo();doc={vars:structuredClone(SAMPLE.vars),shapes:[]};setSel(null);render();toast('新規にしました（⌘Zで戻せます）')};
function setFrame(on){UI.showFrame=on;saveUI();$('xFrame').setAttribute('aria-pressed',String(on));render()}
$('xFrame').onclick=()=>{setFrame(!UI.showFrame);if(UI.showFrame){const bb=contentBB();if(bb){const L=pdfLayout(bb,{size:UI.pdfSize||'A4',orient:UI.pdfOrient||'auto'});toast(`${L.label}・${L.cols*L.rows}枚の印刷範囲を表示しています（用紙と向きはPDFボタンで変更）`,3500)}}};
// share: the whole pattern goes into the URL after "#p=" (compressed when the browser can), so nothing is uploaded anywhere
const b64u=bytes=>{let b='';for(let i=0;i<bytes.length;i+=0x8000)b+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(b).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const unb64u=str=>{const b=atob(str.replace(/-/g,'+').replace(/_/g,'/'));const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};
async function streamBytes(bytes,ctor,fmt){const st=new Blob([bytes]).stream().pipeThrough(new ctor(fmt));return new Uint8Array(await new Response(st).arrayBuffer())}
async function encodeDoc(d){const raw=new TextEncoder().encode(JSON.stringify(d));
  if(window.CompressionStream){try{return'z'+b64u(await streamBytes(raw,CompressionStream,'deflate-raw'))}catch(e){}}return'j'+b64u(raw)}
async function decodeDoc(str){const kind=str[0],bytes=unb64u(str.slice(1));const raw=kind==='z'?await streamBytes(bytes,DecompressionStream,'deflate-raw'):bytes;return JSON.parse(new TextDecoder().decode(raw))}
$('xShare').onclick=async()=>{let url;try{url=location.href.split('#')[0]+'#p='+await encodeDoc(doc)}catch(e){toast('共有用のURLを作れませんでした');return}
  const kb=(url.length/1024).toFixed(1);
  try{await navigator.clipboard.writeText(url);toast(`共有用のURLをコピーしました（${kb} KB）`)}
  catch(e){$('mTitle').textContent='共有用のURL';$('mNote').textContent='自動でコピーできなかったので、下の文字列をコピーしてください。';$('mText').value=url;$('mSave').hidden=true;$('modal').hidden=false;$('mText').focus();$('mText').select()}};
async function loadFromLink(){const h=location.hash;if(!h.startsWith('#p='))return false;
  try{const d=await decodeDoc(h.slice(3));if(!d.shapes||!d.vars)throw 0;pushUndo();doc=migrate(d);setSel(null);history.replaceState(null,'',location.pathname+location.search);fit();toast('共有された型紙を開きました（⌘Zで前の作業に戻せます）',4000);return true}
  catch(e){toast('共有リンクの型紙を読み込めませんでした');history.replaceState(null,'',location.pathname+location.search);return false}}
addEventListener('hashchange',loadFromLink);

if(document.readyState==='complete')boot();else addEventListener('load',boot);
})();
